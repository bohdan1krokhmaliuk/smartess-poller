# Copy to config.ini and edit. All keys are optional — built-in defaults are used
# for anything omitted. Any key can also be overridden by an env var, e.g.
# SMARTESS_POLL_INTERVAL=5

[smartess]
# TCP port the dongle connects to. Eybond dongles use 502 (privileged -> needs
# sudo or setcap). Set higher and NAT-redirect if you prefer running unprivileged.
listen_port   = 502
listen_host   = 0.0.0.0

# MQTT broker
mqtt_host     = 127.0.0.1
mqtt_port     = 1883
mqtt_user     =
mqtt_pass     =

# Topic prefix for published values (keep the trailing slash)
topic         = smartess/

# Seconds between polls. 5-10 is safe. Do NOT go below 3 — the dongle's MCU and
# the inverter's RS485 bus are slow and can drop replies / reset the connection.
poll_interval = 10

# Per-request socket timeout (seconds)
sock_timeout  = 8

# --- Passthrough mode (optional) ---
# Leave cloud_host empty to act as the sole (fake) cloud — the dongle is fully
# cut off from the internet and we drive it ourselves (default, most private).
#
# Set cloud_host to the REAL Eybond cloud IP to run as a transparent proxy: the
# dongle <-> cloud traffic is relayed unchanged (so the SmartESS app keeps
# working) while we poll in parallel for MQTT. The hostname is DNS-redirected to
# this box, so you must use the numeric IP:  dig +short ess.eybond.com @8.8.8.8
cloud_host    =
cloud_port    = 502

# In passthrough mode, also inject our own QPIGS/QMOD/QET polls at poll_interval
# (guarantees a steady rate even when the app is closed). Set false to only
# passively parse whatever the cloud/app requests.
active_poll   = true

# Print every cloud request/reply to the console (passthrough only) for analysis.
log_cloud     = false
