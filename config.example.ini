# Copy to config.ini and edit. All keys are optional — built-in defaults are used
# for anything omitted. Any key can also be overridden by an env var, e.g.
# SMARTESS_POLL_INTERVAL=5

[smartess]
# TCP port the dongle connects to. Eybond dongles use 502 (privileged -> needs
# sudo or setcap). Set higher and NAT-redirect if you prefer running unprivileged.
listen_port   = 502
listen_host   = 0.0.0.0

# MQTT broker
mqtt_host     = 127.0.0.1
mqtt_port     = 1883
mqtt_user     =
mqtt_pass     =

# Topic prefix for published values (keep the trailing slash)
topic         = smartess/

# Seconds between polls. 5-10 is safe. Do NOT go below 3 — the dongle's MCU and
# the inverter's RS485 bus are slow and can drop replies / reset the connection.
poll_interval = 10

# Per-request socket timeout (seconds, local mode)
sock_timeout  = 8

# --- Operating mode ---
#   local  = we act as the (fake) cloud and poll the inverter ourselves every
#            poll_interval. Fast, steady 10s data 24/7, but the SmartESS app does
#            NOT work (the dongle is cut off from the real cloud).
#   mirror = transparent relay dongle <-> real Eybond cloud. The SmartESS app
#            works fully (viewing AND settings changes); we passively capture the
#            data that flows (slower, at the cloud's cadence).
# Switch live at runtime by publishing "local" or "mirror" to
#   <topic>control/mode        e.g.  mosquitto_pub -t smartess/control/mode -m local
# The current mode is published (retained) to <topic>mode_active.
mode          = mirror

# Real Eybond cloud IP for mirror mode. The hostname is DNS-redirected to this
# box, so use the numeric IP:  dig +short ess.eybond.com @8.8.8.8
cloud_host    = 47.83.160.214
cloud_port    = 502

# In mirror mode, print every cloud request/reply to the console (for analysis).
log_cloud     = false
