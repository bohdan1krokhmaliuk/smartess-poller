<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inverter</title>
<style>
:root{
  --bg:#f4f6fb; --panel:#ffffff; --panel2:#eef1f7; --text:#0f172a; --muted:#64748b;
  --border:#e2e8f0; --grid:#e7ebf3; --accent:#2563eb; --good:#16a34a; --warn:#f59e0b; --bad:#dc2626;
  --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
}
:root[data-theme=dark]{
  --bg:#0b1020; --panel:#111829; --panel2:#0e1524; --text:#e6ebf5; --muted:#8896ad;
  --border:#1e293b; --grid:#1b2437; --accent:#3b82f6; --good:#22c55e; --warn:#eab308; --bad:#ef4444;
  --shadow:0 1px 3px rgba(0,0,0,.4); color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme=light]){ color-scheme:dark;
  --bg:#0b1020; --panel:#111829; --panel2:#0e1524; --text:#e6ebf5; --muted:#8896ad;
  --border:#1e293b; --grid:#1b2437; --accent:#3b82f6; --good:#22c55e; --warn:#eab308; --bad:#ef4444;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}}
*{box-sizing:border-box} html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,system-ui,sans-serif;
  background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; padding-bottom:2rem}
header{position:sticky; top:0; z-index:20; background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(150%) blur(8px); border-bottom:1px solid var(--border);
  padding:.55rem clamp(.6rem,2vw,1.2rem); display:flex; flex-wrap:wrap; gap:.5rem .7rem; align-items:center}
body.kiosk header{display:none}
.brand{font-weight:700; font-size:1.05rem; margin-right:.2rem; display:flex; align-items:center; gap:.4rem}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.brand .dot.stale{background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 25%,transparent)}
.spacer{flex:1 1 auto}
.seg{display:inline-flex; background:var(--panel2); border:1px solid var(--border); border-radius:.6rem; overflow:hidden}
.seg button{appearance:none; border:0; background:transparent; color:var(--muted); padding:.34rem .58rem; font-size:.82rem; cursor:pointer; font-weight:600}
.seg button.on{background:var(--accent); color:#fff} .seg button:hover:not(.on){color:var(--text)}
.iconbtn{appearance:none; border:1px solid var(--border); background:var(--panel); color:var(--text); min-width:34px;height:32px; padding:0 .5rem; border-radius:.55rem; cursor:pointer; font-size:1rem; line-height:1}
.iconbtn.on{border-color:var(--accent); color:var(--accent)}
.rel{position:relative; display:inline-flex}
.popover{position:absolute; top:38px; right:0; background:var(--panel); border:1px solid var(--border); border-radius:.7rem; box-shadow:var(--shadow); padding:.7rem; display:none; z-index:30; min-width:220px}
.popover.open{display:block}
.popover label{display:block; font-size:.72rem; color:var(--muted); margin:.3rem 0 .1rem}
.popover input{width:100%; padding:.35rem; border:1px solid var(--border); border-radius:.4rem; background:var(--panel2); color:var(--text); font-size:.82rem}
.popover .apply{margin-top:.55rem; width:100%; border:0; background:var(--accent); color:#fff; padding:.45rem; border-radius:.5rem; font-weight:700; cursor:pointer}
.mode{display:inline-flex; align-items:center; gap:.35rem; font-size:.82rem; color:var(--muted)}
.badge{padding:.24rem .55rem; border-radius:.5rem; font-weight:700; font-size:.78rem; color:#fff; letter-spacing:.02em}
.badge.local{background:var(--accent)} .badge.mirror{background:var(--good)} .badge.unknown{background:var(--muted)}
.modebtn{appearance:none;border:1px solid var(--border);background:var(--panel);color:var(--text); padding:.28rem .5rem;border-radius:.5rem;font-size:.76rem;font-weight:600;cursor:pointer}
.modebtn:hover{border-color:var(--accent)}
main{padding:clamp(.6rem,2vw,1.1rem); max-width:1600px; margin:0 auto}
.section{margin:1.1rem 0 .5rem; font-size:.82rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; cursor:pointer; user-select:none; display:flex; align-items:center; gap:.4rem}
.section .caret{transition:transform .15s; font-size:.7rem} .section.collapsed .caret{transform:rotate(-90deg)}
.grid{display:grid; grid-template-columns:repeat(12,1fr); gap:.7rem}
.grid.hidden{display:none}
.card{grid-column:span 3; background:var(--panel); border:1px solid var(--border); border-radius:.8rem; box-shadow:var(--shadow); padding:.7rem .8rem; min-width:0; position:relative}
.card h3{margin:0 0 .3rem; font-size:.78rem; font-weight:600; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.card .val{font-size:clamp(1.3rem,2.4vw,1.9rem); font-weight:700; line-height:1.1; color:var(--text)}
.card.chart{grid-column:span 6}
.card.info{grid-column:span 12}
.card.info .val{font-size:.92rem; font-weight:600; color:var(--text)}
.card.info b{color:var(--muted); font-weight:600}
.chartwrap{position:relative; width:100%; height:200px; touch-action:none}
.chartwrap.tl{height:70px}
.chartwrap canvas{position:absolute; inset:0; width:100%; height:100%}
.legend{display:flex; flex-wrap:wrap; gap:.15rem .8rem; margin-top:.3rem; font-size:.72rem; color:var(--muted)}
.legend span{display:inline-flex; align-items:center; gap:.3rem} .legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.tip{position:absolute; pointer-events:none; background:var(--panel); border:1px solid var(--border); border-radius:.5rem; padding:.4rem .55rem; font-size:.72rem; box-shadow:var(--shadow); z-index:5; opacity:0; transition:opacity .08s; min-width:120px}
.tip .t{color:var(--muted); margin-bottom:.25rem} .tip .row{display:flex; justify-content:space-between; gap:.8rem} .tip .row b{color:var(--text)}
.gauge{display:flex; flex-direction:column; align-items:center; justify-content:center} .gauge svg{width:100%; max-width:160px; height:auto}
.err{color:var(--bad); font-size:.75rem}
.banner{display:none; background:var(--bad); color:#fff; text-align:center; padding:.4rem; font-size:.82rem; font-weight:600}
.banner.show{display:block}
@media (max-width:820px){ .card{grid-column:span 6 !important} .card.chart,.card.info{grid-column:span 12 !important} }
</style>
</head>
<body>
<div class="banner" id="banner">⚠ No connection to the data source — retrying…</div>
<header>
  <div class="brand"><span class="dot" id="freshDot"></span> Inverter</div>
  <div class="mode">
    <span class="badge unknown" id="modeBadge">…</span>
    <button class="modebtn" data-mode="local" title="Fast 10s logging (app offline)">LOCAL</button>
    <button class="modebtn" data-mode="mirror" title="SmartESS app works">MIRROR</button>
  </div>
  <div class="spacer"></div>
  <div class="seg" id="presets">
    <button data-dur="900">15m</button><button data-dur="3600">1h</button>
    <button data-dur="21600" class="on">6h</button><button data-dur="86400">24h</button>
    <button data-dur="604800">7d</button><button data-dur="2592000">30d</button>
    <button data-dur="31536000">1y</button><button data-today="1">Today</button>
  </div>
  <span class="rel"><button class="iconbtn" id="customBtn" title="Custom range">📅</button>
    <div class="popover" id="popover"><label>From</label><input type="datetime-local" id="cfrom">
      <label>To</label><input type="datetime-local" id="cto"><button class="apply" id="capply">Apply</button></div></span>
  <div class="seg" id="refreshSel">
    <button data-ms="0">⏸</button><button data-ms="10000">10s</button>
    <button data-ms="30000" class="on">30s</button><button data-ms="60000">1m</button>
  </div>
  <button class="iconbtn" id="refreshNow" title="Refresh now">⟳</button>
  <span class="rel"><button class="iconbtn" id="cfgBtn" title="Settings">⚙</button>
    <div class="popover" id="cfgPop"><label>Tariff (per kWh)</label><input type="number" step="0.01" id="tariff">
      <label>Currency</label><input type="text" id="currency" maxlength="4">
      <label>PV max (W, 0 = auto)</label><input type="number" step="50" id="pvmax"><button class="apply" id="cfgApply">Save</button></div></span>
  <button class="iconbtn" id="themeBtn" title="Toggle theme">🌙</button>
</header>
<main id="main"></main>

<script>
"use strict";
const VM="/vm/api/v1";
let TARIFF=parseFloat(localStorage.getItem("tariff")||"0")||0;
let CUR=localStorage.getItem("currency")||"₴";
let PVMAX=parseFloat(localStorage.getItem("pvmax")||"0")||0;

const M={
  soc:"inverter_battery_capacity", loadpct:"inverter_output_load_percent",
  batV:"inverter_battery_voltage", load:"inverter_ac_output_active_power", apparent:"inverter_ac_output_apparent_power",
  pvpow:"inverter_pv_input_voltage * inverter_pv_input_current", pvV:"inverter_pv_input_voltage", pvA:"inverter_pv_input_current",
  gridV:"inverter_grid_voltage", outV:"inverter_ac_output_voltage", busV:"inverter_bus_voltage",
  gridHz:"inverter_grid_frequency", outHz:"inverter_ac_output_frequency", temp:"inverter_heatsink_temperature",
  chg:"inverter_battery_charge_current", dis:"inverter_battery_discharge_current",
  netbat:"inverter_battery_voltage * (inverter_battery_charge_current - inverter_battery_discharge_current)",
  battdis:"inverter_battery_voltage * inverter_battery_discharge_current",
  grid:"clamp_min(inverter_ac_output_active_power + (inverter_battery_voltage*inverter_battery_charge_current) - (inverter_pv_input_voltage*inverter_pv_input_current) - (inverter_battery_voltage*inverter_battery_discharge_current),0)",
  selfnow:"clamp_max(100*(inverter_pv_input_voltage*inverter_pv_input_current)/inverter_ac_output_active_power,100)",
  pf:"inverter_ac_output_active_power / inverter_ac_output_apparent_power", mode:"mode_value", fault:"fault_value", pvtot:"energy_value",
  avg1h:"avg_over_time(inverter_ac_output_active_power[1h])", avg24h:"avg_over_time(inverter_ac_output_active_power[24h])",
};
const dv={
  cons:w=>`max_over_time(energymeter_consumed_total[${w}s]) - min_over_time(energymeter_consumed_total[${w}s])`,
  pv:w=>`max_over_time(energymeter_pv_total[${w}s]) - min_over_time(energymeter_pv_total[${w}s])`,
  bat:w=>`max_over_time(energymeter_battery_out_total[${w}s]) - min_over_time(energymeter_battery_out_total[${w}s])`,
  grid:w=>`max_over_time(energymeter_grid_total[${w}s]) - min_over_time(energymeter_grid_total[${w}s])`,
  self:w=>`clamp_max(100*(max_over_time(energymeter_pv_total[${w}s])-min_over_time(energymeter_pv_total[${w}s]))/(max_over_time(energymeter_consumed_total[${w}s])-min_over_time(energymeter_consumed_total[${w}s])),100)`,
  peakLoad:w=>`max_over_time(inverter_ac_output_active_power[${w}s])`,
  pvPeak:w=>`max_over_time((inverter_pv_input_voltage*inverter_pv_input_current)[${w}s:2m])`,
  minSoc:w=>`min_over_time(inverter_battery_capacity[${w}s])`,
  uptime:w=>`avg_over_time((inverter_grid_voltage > bool 50)[${w}s:1m])*100`,
};
dv.gridCost=w=>`(${dv.grid(w)})*${TARIFF}`;
dv.savings=w=>`clamp_min((${dv.cons(w)})-(${dv.grid(w)}),0)*${TARIFF}`;
dv.total=w=>`(${dv.cons(w)})*${TARIFF}`;
const MODE_MAP={0:["PowerOn","var(--accent)"],1:["Standby","var(--warn)"],2:["Line","var(--good)"],3:["Battery","var(--accent)"],4:["Fault","var(--bad)"],5:["PowerSaving","var(--warn)"],6:["Shutdown","var(--muted)"],7:["Bypass","var(--warn)"]};
const FAULT_MAP={0:["OK","var(--good)"],1:["FAULT","var(--bad)"]};
const CHG_SRC={0:["Idle","var(--muted)"],1:["☀ Solar","var(--good)"],2:["⚡ Grid","var(--accent)"],3:["Solar + Grid","var(--good)"]};

const SECTIONS=[
 {name:"🔌 Device", panels:[{t:"info",title:"Inverter",span:12}]},
 {name:"⚡ Now", panels:[
   {t:"gauge",title:"Battery SoC",expr:M.soc,live:1,unit:"%",min:0,max:100,span:3,th:[[0,"var(--bad)"],[30,"var(--warn)"],[60,"var(--good)"]],sub:{expr:M.batV,live:1,unit:"V",dec:2}},
   {t:"gauge",title:"Load",expr:M.loadpct,live:1,unit:"%",min:0,max:100,span:3,th:[[0,"var(--good)"],[70,"var(--warn)"],[90,"var(--bad)"]],sub:{expr:M.load,live:1,unit:"W"}},
   {t:"gauge",title:"PV power",expr:M.pvpow,live:1,unit:"W",min:0,max:1000,maxExpr:"energymeter_pv_peak_power",maxSetting:"pvmax",span:3,th:[[0,"#f59e0b"],[75,"var(--good)"]],sub:{expr:"energymeter_pv_peak_power",live:1,unit:"W",pre:"пік "}},
   {t:"stat",title:"Heatsink",expr:M.temp,live:1,unit:"°C",span:3,th:[[0,"var(--good)"],[55,"var(--warn)"],[70,"var(--bad)"]]},
   {t:"table",title:"Sources",span:6,note:"Grid current is inferred (W ÷ V) — the inverter does not report it directly.",cols:["","V","A","W","today"],rows:[
     {label:"PV",color:"#f59e0b",cells:[{expr:M.pvV,unit:"V",dec:1},{expr:M.pvA,unit:"A",dec:1},{expr:M.pvpow,unit:"W"},{expr:"energymeter_pv_today",unit:"eauto"}]},
     {label:"Battery",color:"#22c55e",cells:[{expr:M.batV,unit:"V",dec:2},{expr:"inverter_battery_charge_current - inverter_battery_discharge_current",unit:"A",dec:1},{expr:M.netbat,unit:"W"},{expr:"energymeter_battery_out_today",unit:"eauto"}]},
     {label:"Grid",color:"#3b82f6",cells:[{expr:M.gridV,unit:"V",dec:1},{expr:`(${M.grid})/inverter_grid_voltage`,unit:"A",dec:1},{expr:M.grid,unit:"W"},{expr:"energymeter_grid_today",unit:"eauto"}]},
     {label:"Output",color:"var(--text)",cells:[{expr:M.outV,unit:"V",dec:1},{expr:"inverter_ac_output_active_power/inverter_ac_output_voltage",unit:"A",dec:1},{expr:M.load,unit:"W"},{expr:"energymeter_consumed_today",unit:"eauto"}]}]},
   {t:"stat",title:"Mode",expr:M.mode,live:1,map:MODE_MAP,span:3},
   {t:"stat",title:"Status",expr:M.fault,live:1,map:FAULT_MAP,span:3},
 ]},
 {name:"🔋 Energy", panels:[
   {t:"stat",title:"Generated",dyn:dv.pv,unit:"kWh",dec:2,span:2},
   {t:"stat",title:"Consumed",dyn:dv.cons,unit:"kWh",dec:2,span:2},
   {t:"stat",title:"From battery",dyn:dv.bat,unit:"kWh",dec:2,span:2},
   {t:"stat",title:"From grid",dyn:dv.grid,unit:"kWh",dec:2,span:2},
   {t:"stat",title:"Self-sufficiency",dyn:dv.self,unit:"%",dec:0,span:2,th:[[0,"var(--warn)"],[50,"var(--good)"]]},
   {t:"stat",title:"PV total (life)",expr:M.pvtot,live:1,unit:"kWh",dec:1,span:2},
 ]},
 {name:"💰 Cost (selected range)", panels:[
   {t:"multi",title:"Cost",span:6,items:[
     {label:"Total",dyn:dv.total,unit:"money",dec:2,color:"var(--text)"},
     {label:"Grid",dyn:dv.gridCost,unit:"money",dec:2,color:"var(--bad)"},
     {label:"Solar saved",dyn:dv.savings,unit:"money",dec:2,color:"var(--good)"}]},
 ]},
 {name:"📊 Power by source", panels:[
   {t:"chart",title:"Sources & load (W)",unit:"W",span:8,series:[
     {expr:M.pvpow,label:"solar",color:"#f59e0b"},{expr:M.battdis,label:"battery",color:"#22c55e"},
     {expr:M.grid,label:"grid",color:"#3b82f6"},{expr:M.load,label:"load",color:"var(--text)",width:2}]},
   {t:"chart",title:"Self-sufficiency %",unit:"%",min:0,max:100,span:4,series:[{expr:M.selfnow,label:"PV coverage",color:"#22c55e",fill:1}]},
   {t:"chart",title:"Output power",unit:"W",span:6,series:[{expr:M.load,label:"active",color:"#3b82f6"},{expr:M.apparent,label:"apparent",color:"#a855f7"}]},
   {t:"chart",title:"Load %",unit:"%",min:0,max:100,span:6,series:[{expr:M.loadpct,label:"load",color:"#f59e0b",fill:1}]},
 ]},
 {name:"📈 History & state", panels:[
   {t:"chart",kind:"bars",title:"Energy over time (kWh)",unit:"kWh",span:12,series:[
     {counter:"energymeter_pv_total",label:"generated",color:"#f59e0b"},
     {counter:"energymeter_consumed_total",label:"consumed",color:"#3b82f6"}]},
   {t:"chart",kind:"timeline",title:"Mode timeline",span:12,map:MODE_MAP,series:[{expr:M.mode,label:"mode"}]},
 ]},
 {name:"🔋 Battery", panels:[
   {t:"multi",title:"Charging now",span:6,items:[
     {label:"Current",expr:M.chg,live:1,unit:"A",dec:1,color:"var(--good)"},
     {label:"Power",expr:"inverter_battery_voltage*inverter_battery_charge_current",live:1,unit:"W",color:"var(--good)"},
     {label:"At voltage",expr:M.batV,live:1,unit:"V",dec:2,color:"var(--text)"},
     {label:"Source",expr:"energymeter_charge_from_solar + 2*energymeter_charge_from_grid",live:1,map:CHG_SRC},
     {label:"Target bulk",expr:"energymeter_rated_bulk_v",live:1,unit:"V",dec:1,color:"var(--muted)"},
     {label:"Target float",expr:"energymeter_rated_float_v",live:1,unit:"V",dec:1,color:"var(--muted)"},
     {label:"Max current",expr:"energymeter_rated_max_charge_a",live:1,unit:"A",dec:0,color:"var(--muted)"}]},
   {t:"chart",title:"SoC & voltage",span:6,series:[{expr:M.batV,label:"voltage",color:"#3b82f6",unit:"V"},{expr:M.soc,label:"SoC",color:"#22c55e",unit:"%",axis:"right",min:0,max:100}]},
   {t:"chart",title:"Charge / discharge current",unit:"A",span:6,series:[{expr:M.chg,label:"charge",color:"#22c55e"},{expr:M.dis,label:"discharge",color:"#ef4444"}]},
   {t:"chart",title:"Net battery power (+charge / −discharge)",unit:"W",span:6,series:[{expr:M.netbat,label:"net",color:"#06b6d4",fill:1}]},
 ]},
 {name:"☀️ Solar", panels:[
   {t:"chart",title:"PV voltage / current / power",span:9,series:[{expr:M.pvV,label:"voltage",color:"#3b82f6",unit:"V"},{expr:M.pvA,label:"current",color:"#22c55e",unit:"A"},{expr:M.pvpow,label:"power",color:"#f59e0b",unit:"W",axis:"right"}]},
   {t:"stat",title:"PV peak",dyn:dv.pvPeak,unit:"W",span:3},
 ]},
 {name:"🔗 Grid & output", panels:[
   {t:"chart",title:"Voltages (grid / output / bus)",unit:"V",span:6,series:[{expr:M.gridV,label:"grid",color:"#3b82f6"},{expr:M.outV,label:"output",color:"#22c55e"},{expr:M.busV,label:"bus",color:"#a855f7"}]},
   {t:"chart",title:"Frequencies",unit:"Hz",dec:2,span:3,series:[{expr:M.gridHz,label:"grid",color:"#3b82f6"},{expr:M.outHz,label:"output",color:"#22c55e"}]},
   {t:"stat",title:"Grid uptime",dyn:dv.uptime,unit:"%",dec:1,span:3,th:[[0,"var(--bad)"],[80,"var(--warn)"],[98,"var(--good)"]]},
 ]},
 {name:"🔎 Power quality", panels:[
   {t:"stat",title:"Power factor now",expr:M.pf,live:1,unit:"",dec:2,span:3,th:[[0,"var(--bad)"],[0.7,"var(--warn)"],[0.9,"var(--good)"]]},
   {t:"chart",title:"Power factor",unit:"",min:0,max:1,dec:2,span:9,series:[{expr:M.pf,label:"PF",color:"#06b6d4",fill:1}]},
 ]},
 {name:"🌡️ Health & averages", panels:[
   {t:"chart",title:"Heatsink temperature",unit:"°C",span:6,series:[{expr:M.temp,label:"temp",color:"#ef4444",fill:1}]},
   {t:"chart",title:"Average load (1h / 24h)",unit:"W",span:4,series:[{expr:M.avg1h,label:"avg 1h",color:"#3b82f6"},{expr:M.avg24h,label:"avg 24h",color:"#a855f7"}]},
   {t:"stat",title:"Min SoC",dyn:dv.minSoc,unit:"%",span:2,th:[[0,"var(--bad)"],[20,"var(--warn)"],[40,"var(--good)"]]},
 ]},
];

const cssVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const resolveColor=c=>(c&&c.startsWith("var("))?cssVar(c.slice(4,-1)):c;
function fmt(v,unit,dec){
  if(v==null||!isFinite(v))return "—"; const u=unit||"";
  if(u==="money")return v.toFixed(dec??2)+" "+CUR;
  if(u==="W"&&Math.abs(v)>=1000)return (v/1000).toFixed(dec??2)+" kW";
  if(u==="W")return Math.round(v)+" W";
  if(u==="kWh")return v.toFixed(dec??2)+" kWh";
  if(u==="eauto")return Math.abs(v)<1?(v*1000).toFixed(0)+" Wh":v.toFixed(2)+" kWh";
  if(u==="%")return v.toFixed(dec??0)+" %"; if(u==="°C")return v.toFixed(dec??0)+" °C";
  if(u==="V")return v.toFixed(dec??1)+" V"; if(u==="A")return v.toFixed(dec??1)+" A"; if(u==="Hz")return v.toFixed(dec??2)+" Hz";
  return dec!=null?v.toFixed(dec):(""+Math.round(v*100)/100);
}
function thColor(v,th){ if(th==null||v==null)return null; let c=null; for(const [t,col] of th){ if(v>=t)c=col; } return c; }
function hexA(c,a){ if(c&&c[0]==="#"){ const n=c.length===4?c.replace(/#(.)(.)(.)/,"#$1$1$2$2$3$3"):c;
  return `rgba(${parseInt(n.slice(1,3),16)},${parseInt(n.slice(3,5),16)},${parseInt(n.slice(5,7),16)},${a})`; } return c; }
let CONN=true;
function conn(ok){ if(ok!==CONN){ CONN=ok; document.getElementById("banner").classList.toggle("show",!ok); } }
async function qInstant(expr,atMs){ try{ const r=await fetch(`${VM}/query?query=${encodeURIComponent(expr)}&time=${Math.round(atMs/1000)}`);
  const j=await r.json(); conn(true); const res=j.data&&j.data.result; if(!res||!res.length)return null; const v=parseFloat(res[0].value[1]); return isFinite(v)?v:null; }catch(e){ conn(false); return undefined; } }
async function qRange(expr,from,to,st){ try{ const r=await fetch(`${VM}/query_range?query=${encodeURIComponent(expr)}&start=${Math.round(from/1000)}&end=${Math.round(to/1000)}&step=${st}`);
  const j=await r.json(); conn(true); const res=j.data&&j.data.result; if(!res||!res.length)return []; let best=res[0]; for(const s of res)if(s.values.length>best.values.length)best=s;
  return best.values.map(p=>[p[0]*1000,parseFloat(p[1])]).filter(p=>isFinite(p[1])); }catch(e){ conn(false); return []; } }

const state={ kind:"preset", dur:21600*1000, abs:null, autoMs:30000, timer:null };
function range(){ if(state.kind==="preset"){ const to=Date.now(); return {from:to-state.dur,to}; } return state.abs; }
function stepSec(){ const {from,to}=range(); return Math.max(10, Math.round((to-from)/1000/400)); }
function windowSec(){ const {from,to}=range(); const evalT=Math.min(to,Date.now()); return {evalT, win:Math.max(60,Math.round((evalT-from)/1000))}; }
const BUCKETS=[60,300,900,1800,3600,10800,21600,43200,86400,604800,2592000]; // 1m … 1 month
function chooseBucket(spanSec){ const target=spanSec/60; for(const b of BUCKETS){ if(b>=target) return b; } return BUCKETS[BUCKETS.length-1]; }

function gaugeSVG(el,v,min,max,unit,dec,th,sub){ const cx=80,cy=76,r=60,a0=140,a1=400;
  const frac=(v==null)?0:Math.max(0,Math.min(1,(v-min)/(max-min))); const col=resolveColor(thColor(v,th)||"var(--accent)");
  const pt=a=>{const x=a*Math.PI/180;return [cx+r*Math.cos(x),cy+r*Math.sin(x)];};
  const arc=(f,t)=>{const [x0,y0]=pt(f),[x1,y1]=pt(t);return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 ${(t-f)>180?1:0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;};
  el.innerHTML=`<svg viewBox="0 0 160 122"><path d="${arc(a0,a1)}" fill="none" stroke="${cssVar('--grid')}" stroke-width="12" stroke-linecap="round"/>
    <path d="${arc(a0,a0+(a1-a0)*frac)}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round"/>
    <text x="80" y="72" text-anchor="middle" font-size="36" font-weight="800" fill="${v==null?cssVar('--muted'):col}">${v==null?'—':(dec!=null?v.toFixed(dec):Math.round(v))}<tspan font-size="16" dx="1" fill="${cssVar('--muted')}">${unit||''}</tspan></text>
    ${sub?`<text x="80" y="97" text-anchor="middle" font-size="15" font-weight="600" fill="${cssVar('--muted')}">${sub}</text>`:''}</svg>`; }

function segs(pts,gap){ const out=[]; let cur=[]; for(let i=0;i<pts.length;i++){ if(i&&pts[i][0]-pts[i-1][0]>gap){ if(cur.length)out.push(cur); cur=[]; } cur.push(pts[i]); } if(cur.length)out.push(cur); return out; }
function niceTicks(mn,mx,n){ if(mn===mx)return [mn]; const raw=(mx-mn)/n,mag=Math.pow(10,Math.floor(Math.log10(raw))),nm=raw/mag; const s=(nm>=5?5:nm>=2?2:1)*mag,out=[]; for(let v=Math.ceil(mn/s)*s;v<=mx+1e-9;v+=s)out.push(v); return out.length?out:[mn,mx]; }
function fmtAxis(v){ const a=Math.abs(v); if(a>=1000)return (v/1000).toFixed(a>=10000?0:1)+"k"; if(a>0&&a<1)return v.toFixed(2); return (Math.round(v*100)/100).toString(); }
function timeTicks(from,to){ const span=to-from,out=[]; const steps=[60e3,300e3,900e3,3600e3,3*3600e3,6*3600e3,12*3600e3,864e5,7*864e5]; let s=steps[steps.length-1]; for(const st of steps){ if(span/st<=7){s=st;break;} }
  const off=new Date().getTimezoneOffset()*60000; for(let v=Math.ceil((from-off)/s)*s+off; v<=to; v+=s) out.push({t:v,l:fmtTick(v,span)}); return out; }
function fmtTick(t,span){ const d=new Date(t),p=n=>String(n).padStart(2,"0"); return span<=2*864e5 ? p(d.getHours())+":"+p(d.getMinutes()) : p(d.getDate())+"."+p(d.getMonth()+1); }

const CHARTS=[]; let G={t:null,active:null};
function broadcast(){ CHARTS.forEach(c=>c.drawOv()); }
class Chart{
  constructor(wrap,panel){ this.wrap=wrap; this.p=panel; this.series=[]; this.stepMs=60000; this.drag=null; CHARTS.push(this);
    this.base=document.createElement("canvas"); this.ov=document.createElement("canvas"); this.tip=document.createElement("div"); this.tip.className="tip"; wrap.append(this.base,this.ov,this.tip);
    this.ov.addEventListener("pointermove",e=>this.onMove(e));
    this.ov.addEventListener("pointerleave",()=>{ G.t=null; G.active=null; CHARTS.forEach(c=>c.tip.style.opacity=0); broadcast(); });
    this.ov.addEventListener("pointerdown",e=>{this.ov.setPointerCapture(e.pointerId);this.drag={x0:this.mx(e),x1:this.mx(e)};});
    this.ov.addEventListener("pointerup",e=>{ if(this.drag){ const t0=this.xToT(this.drag.x0),t1=this.xToT(this.drag.x1); this.drag=null; if(Math.abs(t1-t0)>5000) setAbs(Math.min(t0,t1),Math.max(t0,t1)); this.drawOv(); }});
    this.ov.addEventListener("dblclick",()=>{ if(state.kind==="preset")setPreset(state.dur); else refresh(); });
  }
  mx(e){ return e.clientX-this.base.getBoundingClientRect().left; }
  domain(){ return range(); }
  geom(){ const w=this.base.clientWidth,h=this.base.clientHeight,hasR=this.series.some(s=>s.axis==="right"),tl=this.p.kind==="timeline"; return {w,h,pl:tl?8:46,pr:hasR?46:12,pt:8,pb:20,hasR}; }
  xToT(x){ const g=this.geom(),{from,to}=this.domain(); return from+(x-g.pl)/(g.w-g.pl-g.pr)*(to-from); }
  setData(series){ this.series=series; this.draw(); }
  scales(){ const {from,to}=range(); const g=this.geom();
    const rng=(arr,pmin,pmax)=>{ let mn=Infinity,mx=-Infinity; arr.forEach(s=>s.pts.forEach(p=>{if(p[1]<mn)mn=p[1];if(p[1]>mx)mx=p[1];}));
      if(pmin!=null)mn=pmin; if(pmax!=null)mx=pmax; if(!isFinite(mn)||!isFinite(mx)){mn=0;mx=1;} if(mn===mx){mn=Math.min(mn,0);mx+=1;} if(pmin==null)mn=mn>0?0:mn*1.1; if(pmax==null)mx*=1.08; return [mn,mx]; };
    const L=this.series.filter(s=>s.axis!=="right"),R=this.series.filter(s=>s.axis==="right"),rp=R[0]||{};
    const [lmin,lmax]=rng(L,this.p.min,this.p.max),[rmin,rmax]=rng(R,rp.min,rp.max); return {from,to,lmin,lmax,rmin,rmax,g}; }
  draw(){ const c=this.base,dpr=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight; if(!w)return;
    c.width=w*dpr;c.height=h*dpr;this.ov.width=w*dpr;this.ov.height=h*dpr; const x=c.getContext("2d");x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,h);
    const {from,to}=this.domain(),g=this.geom(),grid=cssVar("--grid"),muted=cssVar("--muted");
    const X=t=>g.pl+(t-from)/(to-from)*(w-g.pl-g.pr);
    x.font="10px -apple-system,system-ui,sans-serif"; x.textAlign="center"; x.textBaseline="top";
    timeTicks(from,to).forEach(tk=>{const px=X(tk.t);x.strokeStyle=grid;x.beginPath();x.moveTo(px,g.pt);x.lineTo(px,h-g.pb);x.stroke();x.fillStyle=muted;x.fillText(tk.l,px,h-g.pb+4);});
    const empty=this.series.every(s=>!s.pts||!s.pts.length);
    if(empty){ x.fillStyle=muted;x.textBaseline="middle";x.fillText("No data in range",w/2,h/2); this._X=X; this.drawOv(); return; }
    if(this.p.kind==="timeline"){ const s=this.series[0],y0=g.pt,y1=h-g.pb;
      const runs=[]; for(const p of s.pts){ const v=Math.round(p[1]); if(runs.length&&runs[runs.length-1].v===v)continue; runs.push({t:p[0],v}); }
      for(let i=0;i<runs.length;i++){ const t0=runs[i].t,t1=(i<runs.length-1?runs[i+1].t:Math.min(to,Date.now())),m=this.p.map[runs[i].v]; if(!m)continue;
        const xa=X(t0),xb=X(t1); x.fillStyle=hexA(resolveColor(m[1]),.9); x.fillRect(xa,y0,Math.max(1,xb-xa),y1-y0);
        if(xb-xa>44){ x.fillStyle="#fff"; x.textAlign="center"; x.textBaseline="middle"; x.font="11px system-ui"; x.fillText(m[0],(xa+xb)/2,(y0+y1)/2); } }
      this._X=X; this.drawOv(); return; }
    const S=this.scales(); const YL=v=>g.pt+(1-(v-S.lmin)/(S.lmax-S.lmin))*(h-g.pt-g.pb); const YR=v=>g.pt+(1-(v-S.rmin)/(S.rmax-S.rmin))*(h-g.pt-g.pb);
    x.textAlign="right";x.textBaseline="middle";x.strokeStyle=grid;x.fillStyle=muted;
    niceTicks(S.lmin,S.lmax,4).forEach(v=>{const y=YL(v);x.beginPath();x.moveTo(g.pl,y);x.lineTo(w-g.pr,y);x.stroke();x.fillText(fmtAxis(v),g.pl-5,y);});
    if(g.hasR){x.textAlign="left";niceTicks(S.rmin,S.rmax,4).forEach(v=>x.fillText(fmtAxis(v),w-g.pr+5,YR(v)));}
    const base=YL(S.lmin<0?0:S.lmin);
    if(this.p.kind==="bars"){ const n=this.series.length,bms=this.bucketMs||864e5,bw=Math.max(2,(X(from+bms)-X(from))*0.72/n);
      this.series.forEach((s,si)=>{ x.fillStyle=resolveColor(s.color); s.pts.forEach(p=>{ const cx=X(p[0])+(si-(n-1)/2)*bw,y=YL(p[1]); x.fillRect(cx-bw/2, Math.min(y,base), bw, Math.abs(base-y)); }); }); this._X=X; this.drawOv(); return; }
    const gap=this.stepMs*2.5;
    this.series.forEach(s=>{ if(!s.pts.length)return; const Y=s.axis==="right"?YR:YL,col=resolveColor(s.color);
      segs(s.pts,gap).forEach(seg=>{ if(s.fill&&seg.length>1){ x.beginPath(); seg.forEach((p,i)=>{const px=X(p[0]),py=Y(p[1]);i?x.lineTo(px,py):x.moveTo(px,py);}); x.lineTo(X(seg[seg.length-1][0]),base);x.lineTo(X(seg[0][0]),base);x.closePath();x.fillStyle=hexA(col,.16);x.fill(); }
        x.beginPath(); seg.forEach((p,i)=>{const px=X(p[0]),py=Y(p[1]);i?x.lineTo(px,py):x.moveTo(px,py);}); x.strokeStyle=col;x.lineWidth=s.width||1.4;x.lineJoin="round";x.stroke(); }); });
    this._X=X; this.drawOv();
  }
  drawOv(){ const c=this.ov,dpr=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight,g=this.geom(); const x=c.getContext("2d");x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,h);
    if(this.drag){ const a=Math.min(this.drag.x0,this.drag.x1),b=Math.max(this.drag.x0,this.drag.x1); x.fillStyle=hexA(resolveColor("var(--accent)"),.15);x.fillRect(a,g.pt,b-a,h-g.pt-g.pb); return; }
    if(G.t!=null&&this._X){ const px=this._X(G.t); if(px>=g.pl&&px<=w-g.pr){ x.strokeStyle=cssVar("--muted");x.setLineDash([4,3]);x.beginPath();x.moveTo(px,g.pt);x.lineTo(px,h-g.pb);x.stroke();x.setLineDash([]); } } }
  onMove(e){ if(!this._X)return; const mx=this.mx(e); if(this.drag){this.drag.x1=mx;this.drawOv();return;}
    const t=this.xToT(mx); let nt=null,nd=1e15; (this.series[0]&&this.series[0].pts||[]).forEach(p=>{const d=Math.abs(p[0]-t);if(d<nd){nd=d;nt=p[0];}});
    if(nt==null){G.t=null;G.active=null;broadcast();this.tip.style.opacity=0;return;} G.t=nt;G.active=this; CHARTS.forEach(c=>{if(c!==this)c.tip.style.opacity=0;}); broadcast();
    const rows=this.series.map(s=>{const p=s.pts.find(q=>q[0]===nt); if(!p)return ""; let val=this.p.map?(this.p.map[Math.round(p[1])]||["—"])[0]:fmt(p[1],s.unit||this.p.unit,s.dec??this.p.dec);
      return `<div class="row"><span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${resolveColor(s.color||(this.p.map?(this.p.map[Math.round(p[1])]||["","var(--muted)"])[1]:"var(--muted)"))}"></i> ${s.label}</span><b>${val}</b></div>`;}).join("");
    this.tip.innerHTML=`<div class="t">${new Date(nt).toLocaleString()}</div>${rows}`; this.tip.style.opacity=1;
    const rw=this.wrap.clientWidth; let left=this._X(nt)+12; if(left>rw-135)left=this._X(nt)-135; this.tip.style.left=Math.max(4,left)+"px"; this.tip.style.top="6px"; }
}

const main=document.getElementById("main"),cards=[]; const collapsed=new Set(JSON.parse(localStorage.getItem("collapsed")||"[]"));
for(const sec of SECTIONS){ const head=document.createElement("div");head.className="section";head.innerHTML=`<span class="caret">▾</span> ${sec.name}`; main.append(head);
  const grid=document.createElement("div");grid.className="grid";main.append(grid);
  head.addEventListener("click",()=>{ const on=grid.classList.toggle("hidden"); head.classList.toggle("collapsed",on); if(on)collapsed.add(sec.name);else collapsed.delete(sec.name); localStorage.setItem("collapsed",JSON.stringify([...collapsed])); if(!on)cards.forEach(c=>c.chart&&c.chart.draw()); });
  if(collapsed.has(sec.name)){ grid.classList.add("hidden"); head.classList.add("collapsed"); }
  for(const p of sec.panels){ const card=document.createElement("div");card.className="card"+(p.t==="chart"?" chart":"")+(p.t==="info"?" info":"");card.style.gridColumn="span "+(p.span||3);
    const title=document.createElement("h3");title.textContent=p.title;card.append(title);
    if(p.t==="chart"){ const body=document.createElement("div");body.className="chartwrap"+(p.kind==="timeline"?" tl":"");card.append(body);
      const leg=document.createElement("div");leg.className="legend";card.append(leg);
      const legItems=(p.kind==="timeline"?Object.values(p.map).map(m=>({label:m[0],color:m[1]})):p.series).map(s=>{const sp=document.createElement("span");const ic=document.createElement("i");ic.style.background=resolveColor(s.color);sp.append(ic,document.createTextNode(s.label));leg.append(sp);return {ic,color:s.color};});
      cards.push({p,card,chart:new Chart(body,p),legItems});
    } else { const body=document.createElement("div");body.className=p.t==="gauge"?"gauge":(p.t==="table"?"tbl":"val");if(p.t!=="gauge"&&p.t!=="table")body.textContent="—";card.append(body);cards.push({p,card,el:body,last:null}); }
    grid.append(card);
  }
}

function renderStat(c){ const p=c.p,v=c.last; if(v===undefined){ c.el.innerHTML='<span class="err">—</span>'; return; }
  if(p.map){ const m=p.map[Math.round(v)]; c.el.innerHTML=(v==null||!m)?"—":`<span style="color:${resolveColor(m[1])}">${m[0]}</span>`; return; }
  c.el.textContent=fmt(v,p.unit,p.dec); const col=thColor(v,p.th); c.el.style.color=col?resolveColor(col):"var(--text)"; }
function renderGauge(c){ const p=c.p; const setMax=(p.maxSetting==="pvmax"&&PVMAX>0)?PVMAX:0;
  const mx=setMax>0?setMax:((c.maxv!=null&&isFinite(c.maxv)&&c.maxv>0)?c.maxv:p.max);
  let sub=null;
  if(setMax>0&&p.maxSetting==="pvmax") sub="макс "+fmt(setMax,"W");
  else if(p.sub) sub=(p.sub.pre||"")+fmt(c.subv,p.sub.unit,p.sub.dec);
  gaugeSVG(c.el,c.last,p.min,mx,p.unit,p.dec,p.th,sub); }
function renderMulti(c){ const p=c.p,vals=c.last||[]; c.el.innerHTML=p.items.map((it,i)=>{
  let disp; if(it.map){ const m=it.map[Math.round(vals[i])]; disp=`<b style="color:${m?resolveColor(m[1]):'var(--muted)'};font-weight:700;font-size:1.05rem">${(vals[i]==null||!m)?'—':m[0]}</b>`; }
  else disp=`<b style="color:${resolveColor(it.color||'var(--text)')};font-weight:700;font-size:1.1rem">${fmt(vals[i],it.unit,it.dec)}</b>`;
  return `<div style="display:flex;justify-content:space-between;align-items:baseline;line-height:1.5"><span style="color:var(--muted);font-weight:600;font-size:.82rem">${it.label}</span>${disp}</div>`;}).join(""); }
function renderTable(c){ const p=c.p, rows=c.last||[];
  let h='<div style="overflow-x:auto"><table style="width:100%;min-width:300px;border-collapse:collapse;font-size:.86rem"><thead><tr>'+
    p.cols.map((cl,i)=>`<th style="text-align:${i?'right':'left'};color:var(--muted);font-weight:600;padding:2px 5px;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em">${cl}</th>`).join('')+'</tr></thead><tbody>';
  p.rows.forEach((r,ri)=>{ const vals=rows[ri]||[];
    h+=`<tr><td style="text-align:left;padding:5px;border-top:1px solid var(--grid)"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${resolveColor(r.color)};margin-right:7px;vertical-align:middle"></span><b style="font-weight:600">${r.label}</b></td>`;
    r.cells.forEach((cell,ci)=>{ h+=`<td style="text-align:right;padding:5px;border-top:1px solid var(--grid);font-variant-numeric:tabular-nums;font-weight:600">${fmt(vals[ci],cell.unit,cell.dec)}</td>`; });
    h+='</tr>'; });
  h+='</tbody></table></div>'; if(p.note)h+=`<div style="color:var(--muted);font-size:.68rem;margin-top:5px">${p.note}</div>`;
  c.el.innerHTML=h; }
function renderInfo(c){ const i=c.last||{}; c.el.innerHTML = (i.model||i.serial||i.firmware) ?
  `<b>Model</b> ${i.model||"—"} &nbsp;·&nbsp; <b>Serial</b> ${i.serial||"—"} &nbsp;·&nbsp; <b>Protocol</b> ${i.protocol||"—"} &nbsp;·&nbsp; <b>FW</b> ${i.firmware||"—"}` : "—"; }

async function refresh(){ const now=Date.now(),{from,to}=range(),st=stepSec(),{evalT,win}=windowSec();
  await Promise.all(cards.map(async c=>{ const p=c.p;
    if(p.t==="chart"){ c.chart.stepMs=st*1000;
      if(p.kind==="bars"){ const B=chooseBucket((to-from)/1000); c.chart.bucketMs=B*1000;
        const series=await Promise.all(p.series.map(async s=>({...s, pts:(await qRange(`max_over_time(${s.counter}[${B}s]) - min_over_time(${s.counter}[${B}s])`, from, to, B)).map(pt=>[pt[0]-B*500, pt[1]])}))); c.chart.setData(series); }
      else { const series=await Promise.all(p.series.map(async s=>({...s,pts:await qRange(s.expr,from,to,st)}))); c.chart.setData(series); }
    } else if(p.t==="info"){ try{ c.last=await (await fetch("/info")).json(); }catch(e){} renderInfo(c); }
    else if(p.t==="multi"){ c.last=await Promise.all(p.items.map(it=>qInstant(it.dyn?it.dyn(win):it.expr, it.dyn?evalT:now))); renderMulti(c); }
    else if(p.t==="table"){ c.last=await Promise.all(p.rows.map(r=>Promise.all(r.cells.map(cell=>qInstant(cell.expr,now))))); renderTable(c); }
    else if(p.t==="gauge"){ c.last=await qInstant(p.expr,now); if(p.sub) c.subv=await qInstant(p.sub.dyn?p.sub.dyn(win):p.sub.expr, p.sub.dyn?evalT:now); if(p.maxExpr) c.maxv=await qInstant(p.maxExpr,now); renderGauge(c); }
    else { const expr=p.dyn?p.dyn(win):p.expr, at=p.dyn?evalT:now; c.last=await qInstant(expr,at); renderStat(c); }
  }));
  try{ const age=await qInstant("time() - timestamp(inverter_battery_voltage)",Date.now()); document.getElementById("freshDot").className="dot"+((age==null||age>120)?" stale":""); }catch(e){}
  loadMode();
}

async function loadMode(){ try{ const j=await (await fetch("/control")).json(); setBadge(j.mode); }catch(e){} }
function setBadge(m){ const b=document.getElementById("modeBadge"); b.className="badge "+(m||"unknown"); b.textContent=(m||"?").toUpperCase(); }
document.querySelectorAll(".modebtn").forEach(btn=>btn.addEventListener("click",async()=>{ const m=btn.dataset.mode; if(!confirm("Switch to "+m.toUpperCase()+"?\nThe dongle reconnect can take up to ~2 min."))return; try{ const j=await (await fetch("/control/"+m)).json(); setBadge(j.mode); }catch(e){} }));

function markPreset(el){ document.querySelectorAll("#presets button").forEach(b=>b.classList.toggle("on",b===el)); }
function setPreset(dur){ state.kind="preset"; state.dur=dur; state.abs=null; markPreset([...document.querySelectorAll("#presets button")].find(b=>+b.dataset.dur*1000===dur)); refresh(); }
function setToday(){ const d=new Date(); d.setHours(0,0,0,0); const from=d.getTime(); state.kind="abs"; state.abs={from,to:from+864e5}; markPreset(document.querySelector('#presets [data-today]')); refresh(); }
function setAbs(from,to){ state.kind="abs"; state.abs={from,to}; markPreset(null); refresh(); }
document.querySelectorAll("#presets button").forEach(b=>b.addEventListener("click",()=>{ b.dataset.today?setToday():setPreset(+b.dataset.dur*1000); }));
document.getElementById("refreshNow").addEventListener("click",refresh);
document.querySelectorAll("#refreshSel button").forEach(b=>b.addEventListener("click",()=>{ document.querySelectorAll("#refreshSel button").forEach(x=>x.classList.remove("on")); b.classList.add("on"); state.autoMs=+b.dataset.ms; clearInterval(state.timer); if(state.autoMs)state.timer=setInterval(refresh,state.autoMs); }));
const pop=document.getElementById("popover"),cbtn=document.getElementById("customBtn"); const toInput=ms=>new Date(ms-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);
cbtn.addEventListener("click",()=>{ const open=!pop.classList.contains("open"); if(open){ const {from,to}=range(); document.getElementById("cfrom").value=toInput(from); document.getElementById("cto").value=toInput(to); } pop.classList.toggle("open",open); cbtn.classList.toggle("on",open); });
document.getElementById("capply").addEventListener("click",()=>{ const f=new Date(document.getElementById("cfrom").value).getTime(),t=new Date(document.getElementById("cto").value).getTime(); if(isFinite(f)&&isFinite(t)&&t>f){ pop.classList.remove("open"); cbtn.classList.remove("on"); setAbs(f,t); } });
// settings
const cfgPop=document.getElementById("cfgPop"),cfgBtn=document.getElementById("cfgBtn");
cfgBtn.addEventListener("click",()=>{ const open=!cfgPop.classList.contains("open"); if(open){ document.getElementById("tariff").value=TARIFF||""; document.getElementById("currency").value=CUR; document.getElementById("pvmax").value=PVMAX||""; } cfgPop.classList.toggle("open",open); cfgBtn.classList.toggle("on",open); });
document.getElementById("cfgApply").addEventListener("click",()=>{ TARIFF=parseFloat(document.getElementById("tariff").value)||0; CUR=document.getElementById("currency").value||"₴"; PVMAX=parseFloat(document.getElementById("pvmax").value)||0; localStorage.setItem("tariff",TARIFF); localStorage.setItem("currency",CUR); localStorage.setItem("pvmax",PVMAX); cfgPop.classList.remove("open"); cfgBtn.classList.remove("on"); refresh(); });
document.addEventListener("click",e=>{ if(!e.target.closest(".rel")){ pop.classList.remove("open");cbtn.classList.remove("on"); cfgPop.classList.remove("open");cfgBtn.classList.remove("on"); } });

function curTheme(){ const a=document.documentElement.getAttribute("data-theme"); return a||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"); }
function applyTheme(t){ if(t)document.documentElement.setAttribute("data-theme",t); else document.documentElement.removeAttribute("data-theme"); document.getElementById("themeBtn").textContent=curTheme()==="dark"?"☀️":"🌙";
  cards.forEach(c=>{ if(c.chart){ c.chart.draw(); c.legItems.forEach(l=>l.ic.style.background=resolveColor(l.color)); } else if(c.p.t==="gauge") renderGauge(c); else if(c.p.t==="info") renderInfo(c); else if(c.p.t==="multi") renderMulti(c); else if(c.p.t==="table") renderTable(c); else renderStat(c); }); }
document.getElementById("themeBtn").addEventListener("click",()=>{ const t=curTheme()==="dark"?"light":"dark"; localStorage.setItem("theme",t); applyTheme(t); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{ if(!localStorage.getItem("theme"))applyTheme(null); });
applyTheme(localStorage.getItem("theme")||null);
if(new URLSearchParams(location.search).has("kiosk")) document.body.classList.add("kiosk");

let rz; new ResizeObserver(()=>{clearTimeout(rz);rz=setTimeout(()=>cards.forEach(c=>c.chart&&c.chart.draw()),120);}).observe(main);
state.timer=setInterval(refresh,state.autoMs); refresh();
</script>
</body>
</html>
