<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inverter</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E☀️%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f6fb; --panel:#ffffff; --panel2:#eef1f7; --text:#0f172a; --muted:#64748b;
  --border:#e2e8f0; --grid:#e7ebf3; --accent:#2563eb; --good:#16a34a; --warn:#f59e0b; --bad:#dc2626;
  --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
}
:root[data-theme=dark]{
  --bg:#0b1020; --panel:#111829; --panel2:#0e1524; --text:#e6ebf5; --muted:#8896ad;
  --border:#1e293b; --grid:#1b2437; --accent:#3b82f6; --good:#22c55e; --warn:#eab308; --bad:#ef4444;
  --shadow:0 1px 3px rgba(0,0,0,.4); color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme=light]){ color-scheme:dark;
  --bg:#0b1020; --panel:#111829; --panel2:#0e1524; --text:#e6ebf5; --muted:#8896ad;
  --border:#1e293b; --grid:#1b2437; --accent:#3b82f6; --good:#22c55e; --warn:#eab308; --bad:#ef4444;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}}
*{box-sizing:border-box} html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,system-ui,sans-serif;
  background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; padding-bottom:2rem}
header{position:sticky; top:0; z-index:20; background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(150%) blur(8px); border-bottom:1px solid var(--border);
  padding:.55rem clamp(.6rem,2vw,1.2rem); display:flex; flex-wrap:wrap; gap:.5rem .7rem; align-items:center}
body.kiosk header{display:none}
.brand{font-weight:700; font-size:1.05rem; margin-right:.2rem; display:flex; align-items:center; gap:.4rem}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.brand .dot.stale{background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 25%,transparent)}
.spacer{flex:1 1 auto}
.seg{display:inline-flex; background:var(--panel2); border:1px solid var(--border); border-radius:.7rem; padding:2px; gap:1px}
.seg button{appearance:none; border:0; background:transparent; color:var(--muted); padding:.3rem .55rem; font-size:.8rem; cursor:pointer; font-weight:600; border-radius:.52rem; transition:background .13s,color .13s; white-space:nowrap}
.seg button.on{background:var(--accent); color:#fff; box-shadow:0 1px 4px color-mix(in srgb,var(--accent) 42%,transparent)}
.seg button:hover:not(.on){background:color-mix(in srgb,var(--text) 9%,transparent); color:var(--text)}
.iconbtn{appearance:none; display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--border); background:var(--panel); color:var(--text); min-width:34px;height:32px; padding:0 .5rem; border-radius:.55rem; cursor:pointer; font-size:1rem; line-height:1}
.iconbtn.on{border-color:var(--accent); color:var(--accent)}
.rel{position:relative; display:inline-flex}
.popover{position:absolute; top:38px; right:0; background:var(--panel); border:1px solid var(--border); border-radius:.7rem; box-shadow:var(--shadow); padding:.7rem; display:none; z-index:30; min-width:220px}
.popover.open{display:block}
.popover label{display:block; font-size:.72rem; color:var(--muted); margin:.3rem 0 .1rem}
.popover input{width:100%; padding:.35rem; border:1px solid var(--border); border-radius:.4rem; background:var(--panel2); color:var(--text); font-size:.82rem}
.popover .apply{margin-top:.55rem; width:100%; border:0; background:var(--accent); color:#fff; padding:.45rem; border-radius:.5rem; font-weight:700; cursor:pointer}
#popover{min-width:252px}
.popttl{font-weight:700; font-size:.82rem; margin-bottom:.45rem}
.popq{display:flex; flex-wrap:wrap; gap:.3rem; margin-bottom:.5rem}
.popq button{flex:1 1 44%; border:1px solid var(--border); background:var(--panel2); color:var(--text); border-radius:.45rem; padding:.34rem .4rem; font-size:.72rem; font-weight:600; cursor:pointer; white-space:nowrap; transition:border-color .12s,color .12s}
.popq button:hover{border-color:var(--accent); color:var(--accent)}
.poprow{display:flex; gap:.35rem; align-items:center}
.poprow input{flex:1 1 auto}
#cnow{flex:0 0 auto; border:1px solid var(--border); background:var(--panel2); color:var(--text); border-radius:.4rem; padding:.35rem .5rem; font-size:.74rem; font-weight:600; cursor:pointer}
#cnow:hover{border-color:var(--accent); color:var(--accent)}
.poperr{color:var(--bad); font-size:.7rem; min-height:.9rem; margin:.25rem 0 0}
#popover{max-height:calc(100vh - 88px); overflow-y:auto}
.cal{margin:.15rem 0 .45rem}
.calhdr{display:flex; align-items:center; justify-content:space-between; margin-bottom:.35rem}
.calhdr button{border:1px solid var(--border); background:var(--panel2); color:var(--text); border-radius:.45rem; width:28px; height:26px; cursor:pointer; font-weight:800; font-size:.95rem; line-height:1}
.calhdr button:hover{border-color:var(--accent); color:var(--accent)}
.calhdr .m{font-weight:700; font-size:.82rem}
.calgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:2px}
.calgrid .wd{font-size:.6rem; color:var(--muted); text-align:center; font-weight:700; padding:1px 0}
.calgrid .d{position:relative; height:30px; display:flex; align-items:center; justify-content:center; font-size:.74rem; border-radius:.42rem; cursor:pointer; user-select:none; color:var(--text)}
.calgrid .d .dd{position:absolute; bottom:3px; left:50%; transform:translateX(-50%); width:5px; height:5px; border-radius:50%; background:#22c55e; pointer-events:none}
.calgrid .d .dd.gray{background:var(--muted); opacity:.5}
.calgrid .d.edge .dd{background:#fff}
.calgrid .d.oth{color:var(--muted); opacity:.45}
.calgrid .d:hover:not(.fut){background:color-mix(in srgb,var(--accent) 20%,transparent)}
.calgrid .d.inrange{background:color-mix(in srgb,var(--accent) 15%,transparent); border-radius:0}
.calgrid .d.edge{background:var(--accent); color:#fff; font-weight:700}
.calgrid .d.today{outline:1.5px solid var(--accent); outline-offset:-2px}
.calgrid .d.fut{opacity:.3; cursor:default}
.mode{display:inline-flex; align-items:center; gap:.35rem; font-size:.82rem; color:var(--muted)}
.badge{padding:.24rem .55rem; border-radius:.5rem; font-weight:700; font-size:.78rem; color:#fff; letter-spacing:.02em}
.badge.local{background:var(--accent)} .badge.mirror{background:var(--good)} .badge.unknown{background:var(--muted)}
.modebtn{appearance:none;border:1px solid var(--border);background:var(--panel);color:var(--text); padding:.28rem .5rem;border-radius:.5rem;font-size:.76rem;font-weight:600;cursor:pointer}
.modebtn:hover{border-color:var(--accent)}
main{padding:clamp(.6rem,2vw,1.1rem); max-width:1600px; margin:0 auto}
.section{margin:1.1rem 0 .5rem; font-size:.82rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; cursor:pointer; user-select:none; display:flex; align-items:center; gap:.4rem}
.section .caret{transition:transform .15s; font-size:.7rem} .section.collapsed .caret{transform:rotate(-90deg)}
.grid{display:grid; grid-template-columns:repeat(12,1fr); gap:.7rem}
.grid.hidden{display:none}
.card{grid-column:span 3; background:var(--panel); border:1px solid var(--border); border-radius:.8rem; box-shadow:var(--shadow); padding:.7rem .8rem; min-width:0; position:relative}
.card h3{margin:0 0 .3rem; font-size:.78rem; font-weight:600; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.card h3[data-tip]{text-decoration:underline dotted; text-decoration-color:var(--border); text-underline-offset:2px; cursor:help}
#tip{position:fixed; z-index:200; max-width:280px; background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:.5rem; padding:.5rem .6rem; font-size:.78rem; line-height:1.45; box-shadow:var(--shadow); display:none; pointer-events:none}
.card .val{font-size:clamp(1.3rem,2.4vw,1.9rem); font-weight:700; line-height:1.1; color:var(--text)}
.card.chart{grid-column:span 6}
.card.info{grid-column:span 12}
.card.info .val{font-size:.92rem; font-weight:600; color:var(--text)}
.card.info b{color:var(--muted); font-weight:600}
.chartwrap{position:relative; width:100%; height:200px; touch-action:pan-y}
.chartwrap.tl{height:70px}
.chartwrap canvas{position:absolute; inset:0; width:100%; height:100%}
.legend{display:flex; flex-wrap:wrap; gap:.15rem .8rem; margin-top:.3rem; font-size:.72rem; color:var(--muted)}
.legend span{display:inline-flex; align-items:center; gap:.3rem} .legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.tip{position:absolute; pointer-events:none; background:var(--panel); border:1px solid var(--border); border-radius:.5rem; padding:.4rem .55rem; font-size:.72rem; box-shadow:var(--shadow); z-index:5; opacity:0; transition:opacity .08s; min-width:120px}
.tip .t{color:var(--muted); margin-bottom:.25rem} .tip .row{display:flex; justify-content:space-between; gap:.8rem} .tip .row b{color:var(--text)}
.gauge{display:flex; flex-direction:column; align-items:center; justify-content:center} .gauge svg{width:100%; max-width:160px; height:auto}
.err{color:var(--bad); font-size:.75rem}
.banner{display:none; background:var(--bad); color:#fff; text-align:center; padding:.4rem; font-size:.82rem; font-weight:600}
.banner.show{display:block}
@media (max-width:820px){ .card{grid-column:span 6 !important} .card.chart,.card.info,.card.dual{grid-column:span 12 !important} }
#timebar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg) 93%,transparent);backdrop-filter:saturate(160%) blur(10px);border-top:1px solid var(--border);box-shadow:0 -2px 14px rgba(0,0,0,.09);padding:.4rem clamp(.6rem,2vw,1.2rem) .4rem;display:flex;flex-direction:column;gap:.28rem}
#tbCtrls{display:flex;align-items:center;gap:.35rem .45rem;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;font-size:.76rem}
#tbCtrls::-webkit-scrollbar{height:5px}
#tbCtrls>*{flex:0 0 auto}
#tbCtrls .sp{flex:1 1 auto;min-width:.3rem}
#tbHint{color:var(--muted);font-size:.68rem}
#tbStrip{position:relative;height:30px;background:linear-gradient(var(--panel2),var(--panel));border:1px solid var(--border);border-radius:.55rem;cursor:crosshair;overflow:hidden;touch-action:none;user-select:none;box-shadow:inset 0 1px 4px rgba(0,0,0,.1)}
#tbTicks{position:absolute;inset:0;pointer-events:none}
#tbTicks .maj{position:absolute;top:0;bottom:0;border-left:1px solid var(--grid)}
#tbTicks .min{position:absolute;bottom:0;height:7px;border-left:1px solid var(--border);opacity:.5}
#tbNow{position:absolute;top:0;bottom:0;border-left:1.5px dashed var(--accent);opacity:.8;pointer-events:none;display:none}
#tbWin{position:absolute;top:0;bottom:0;min-width:10px;box-sizing:border-box;background:linear-gradient(color-mix(in srgb,var(--accent) 30%,transparent),color-mix(in srgb,var(--accent) 15%,transparent));border-left:2px solid var(--accent);border-right:2px solid var(--accent);cursor:grab;border-radius:3px;box-shadow:0 2px 10px color-mix(in srgb,var(--accent) 30%,transparent)}
#tbWin::before,#tbWin::after{content:"";position:absolute;top:50%;height:12px;width:2px;border-radius:1px;background:var(--accent);transform:translateY(-50%)}
#tbWin::before{left:3px}#tbWin::after{right:3px}
#tbWin:active{cursor:grabbing}
.tbH{position:absolute;top:0;bottom:0;width:14px;cursor:ew-resize;z-index:2}
.tbH[data-h=l]{left:-7px}.tbH[data-h=r]{right:-7px}
#tbAxis{position:relative;height:11px;font-size:.6rem;color:var(--muted);font-variant-numeric:tabular-nums}
#tbAxis span{position:absolute;transform:translateX(-50%);white-space:nowrap}
#popover{position:fixed;z-index:40;top:auto;right:auto}
body{padding-bottom:96px}
</style>

<body>
<div class="banner" id="banner">⚠ No connection to the data source — retrying…</div>
<header>
  <div class="brand"><span class="dot" id="freshDot"></span> Inverter <span id="lastUpd" style="color:var(--muted);font-size:.68rem;font-weight:400"></span></div>
  <div class="mode">
    <span class="badge unknown" id="modeBadge">…</span>
    <button class="modebtn" data-mode="local" title="Fast 10s logging (app offline)">LOCAL</button>
    <button class="modebtn" data-mode="mirror" title="SmartESS app works">MIRROR</button>
  </div>
  <div class="spacer"></div>
  <span class="rel"><button class="iconbtn" id="cfgBtn" title="Settings">⚙</button>
    <div class="popover" id="cfgPop"><label>Tariff (per kWh)</label><input type="number" step="0.01" id="tariff">
      <label>Currency</label><input type="text" id="currency" maxlength="4">
      <label>PV max (W, 0 = auto / clear-sky)</label><input type="number" step="50" id="pvmax">
      <label>Location lat / lon (clear-sky estimate)</label><div style="display:flex;gap:6px"><input type="number" step="0.001" id="pvlat" placeholder="lat"><input type="number" step="0.001" id="pvlon" placeholder="lon"></div>
      <label>Array kWp / tilt° / azimuth° (180=S)</label><div style="display:flex;gap:6px"><input type="number" step="0.1" id="pvkwp" placeholder="kWp"><input type="number" step="1" id="pvtilt" placeholder="tilt"><input type="number" step="1" id="pvaz" placeholder="az"></div>
      <label>Chart aggregation (per bucket)</label><select id="agg"><option value="avg">avg</option><option value="max">max (catch peaks)</option><option value="min">min</option></select>
      <button class="apply" id="cfgApply">Save</button></div></span>
  <a class="iconbtn" href="/inverter.html" title="Inverter settings (read-only)" style="text-decoration:none">🎛️</a>
  <a class="iconbtn" href="/warnings.html" title="Аварії та попередження" style="text-decoration:none">⚠️</a>
  <button class="iconbtn" id="themeBtn" title="Toggle theme">🌙</button>
</header>
<div id="faultbar" style="display:none;margin:.5rem clamp(.6rem,2vw,1.2rem) 0;font-size:.82rem"></div>
<main id="main"></main>
<div id="timebar">
  <div id="tbCtrls">
    <div class="seg" id="presets">
      <button data-dur="900">15m</button><button data-dur="3600">1h</button><button data-dur="21600" class="on">6h</button><button data-dur="86400">24h</button><button data-dur="604800">7d</button><button data-dur="2592000">30d</button><button data-dur="31536000">1y</button><button data-today="1">Today</button><button id="customBtn" title="Custom period — pick dates">Custom</button>
    </div>
    <div class="seg" id="shiftSel" title="Shift the visible window (keeps the same zoom)">
      <button data-shift="y" data-n="-1" title="−1 year">«Y</button><button data-shift="M" data-n="-1" title="−1 month">«M</button><button data-shift="d" data-n="-1" title="−1 day">«D</button><button data-shift="d" data-n="1" title="+1 day">D»</button><button data-shift="M" data-n="1" title="+1 month">M»</button><button data-shift="y" data-n="1" title="+1 year">Y»</button>
    </div>
    <div class="seg" id="snapSel" title="Snap to the whole current day / week / month / year">
      <button data-snap="day">Day</button><button data-snap="week">Week</button><button data-snap="month">Month</button><button data-snap="year">Year</button>
    </div>
    <button class="iconbtn" id="tbOut" title="Zoom out (2×)">🔍−</button><button class="iconbtn" id="tbIn" title="Zoom in (½×)">🔍+</button>
    <span class="sp"></span>
    <div class="seg" id="refreshSel"><button data-ms="0">⏸</button><button data-ms="10000">10s</button><button data-ms="30000" class="on">30s</button><button data-ms="60000">1m</button></div>
    <button class="iconbtn" id="refreshNow" title="Refresh now">⟳</button>
  </div>
  <div id="tbStrip"><div id="tbTicks"></div><div id="tbNow"></div><div id="tbWin"><i class="tbH" data-h="l"></i><i class="tbH" data-h="r"></i></div></div>
  <div id="tbAxis"></div>
</div>
<div class="popover" id="popover">
  <div class="popttl">Custom period</div>
  <div class="cal"><div class="calhdr"><button id="calPrev" title="Previous month">‹</button><span class="m" id="calM"></span><button id="calNext" title="Next month">›</button></div><div class="calgrid" id="calGrid"></div></div>
  <label>From</label><input type="datetime-local" id="cfrom">
  <label>To</label><div class="poprow"><input type="datetime-local" id="cto"><button id="cnow" title="Set to current time">Now</button></div>
  <div class="poperr" id="poperr"></div>
  <button class="apply" id="capply">Apply</button>
</div>

<script>
"use strict";
const VM="/vm/api/v1";
let TARIFF=parseFloat(localStorage.getItem("tariff")||"4.32")||0;  // UA regulated household tariff (₴/kWh, fixed until Oct 2026); no public API — edit in ⚙
let CUR=localStorage.getItem("currency")||"₴";
let PVMAX=parseFloat(localStorage.getItem("pvmax")||"0")||0;
let AGG=localStorage.getItem("agg")||"avg";   // chart bucket aggregation: avg | max | min
const gnum=k=>{const v=parseFloat(localStorage.getItem(k));return isNaN(v)?null:v;};
let PVLAT=gnum("pvlat"),PVLON=gnum("pvlon"),PVKWP=gnum("pvkwp")||0,PVTILT=gnum("pvtilt"),PVAZ=gnum("pvaz");
// clear-sky PV potential (W) now, from sun position + array geometry — the ceiling the panels could reach under a clear sky
function solarElevAz(lat,lon,d){ const r=Math.PI/180,g=180/Math.PI;
  const N=(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())-Date.UTC(d.getUTCFullYear(),0,0))/864e5;
  const dec=23.45*Math.sin(r*360*(284+N)/365), B=r*360*(N-81)/364, EoT=9.87*Math.sin(2*B)-7.53*Math.cos(B)-1.5*Math.sin(B);
  const utcH=d.getUTCHours()+d.getUTCMinutes()/60+d.getUTCSeconds()/3600, st=utcH+lon/15+EoT/60, H=15*(st-12);
  const sinEl=Math.sin(lat*r)*Math.sin(dec*r)+Math.cos(lat*r)*Math.cos(dec*r)*Math.cos(H*r);
  const el=Math.asin(Math.max(-1,Math.min(1,sinEl)))*g;
  const az=(Math.atan2(Math.sin(H*r),Math.cos(H*r)*Math.sin(lat*r)-Math.tan(dec*r)*Math.cos(lat*r))*g+540)%360;
  return {el,az}; }
// PV system derate: base losses (wiring, inverter, soiling, mismatch) × a cell-temperature
// factor (NOCT model). Mirrors pv_derate() in smartess_poller.py — keep the two in sync.
const PV_NOCT=45, PV_TEMP_COEFF=0.004, PV_BASE_DERATE=0.90;
function pvDerate(gti,tAir){ if(tAir==null)return PV_BASE_DERATE;
  const tCell=tAir+(gti/800)*(PV_NOCT-20);
  return Math.max(0.5,Math.min(1.05, PV_BASE_DERATE*(1-PV_TEMP_COEFF*(tCell-25)))); }
function pvPotentialAt(d){ if(PVLAT==null||PVLON==null||!(PVKWP>0))return null;
  const g=gtiAt(d.getTime());
  if(g!=null) return Math.round(PVKWP*g*pvDerate(g,tempAt(d.getTime())));   // tilted irradiance (clouds modelled) × temperature-aware derate
  const {el,az}=solarElevAz(PVLAT,PVLON,d); if(el<=2)return 0;   // fallback (offline): clear-sky geometry × cloud-cover factor
  const r=Math.PI/180, AM=1/Math.sin(el*r), DNI=1000*Math.pow(0.7,Math.pow(AM,0.678));
  const tilt=(PVTILT==null?30:PVTILT), paz=(PVAZ==null?180:PVAZ);
  const cosAOI=Math.sin(el*r)*Math.cos(tilt*r)+Math.cos(el*r)*Math.sin(tilt*r)*Math.cos((az-paz)*r);
  const POA=DNI*Math.max(0,cosAOI)+0.1*DNI*(1+Math.cos(tilt*r))/2;
  return Math.round(PVKWP*POA*1.03*cloudFactor(cloudAt(d.getTime()))); }
function pvPotentialW(){ return pvPotentialAt(new Date()); }

// settings shared across clients via the poller's /settings (localStorage is the local cache)
const SKEYS=["tariff","currency","pvmax","pvlat","pvlon","pvkwp","pvtilt","pvaz","agg"];
function readSettings(){ TARIFF=parseFloat(localStorage.getItem("tariff")||"4.32")||0; CUR=localStorage.getItem("currency")||"₴"; PVMAX=parseFloat(localStorage.getItem("pvmax")||"0")||0; AGG=localStorage.getItem("agg")||"avg"; PVLAT=gnum("pvlat"); PVLON=gnum("pvlon"); PVKWP=gnum("pvkwp")||0; PVTILT=gnum("pvtilt"); PVAZ=gnum("pvaz"); }
function collectSettings(){ const o={}; SKEYS.forEach(k=>{ const v=localStorage.getItem(k); o[k]=(v==null?"":v); }); return o; }
function applyServer(o){ SKEYS.forEach(k=>{ if(!(k in o))return; const v=o[k]; if(v===""||v==null)localStorage.removeItem(k); else localStorage.setItem(k,v); }); readSettings(); }
async function loadServerSettings(){ try{ const o=await (await fetch("/settings")).json(); if(o&&typeof o==="object"&&Object.keys(o).length) applyServer(o); }catch(e){} }
async function saveServerSettings(){ try{ await fetch("/settings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(collectSettings())}); }catch(e){} }

const M={
  soc:"inverter_battery_capacity", loadpct:"inverter_output_load_percent",
  batV:"inverter_battery_voltage", load:"inverter_ac_output_active_power", apparent:"inverter_ac_output_apparent_power",
  pvpow:"inverter_pv_input_voltage * inverter_pv_input_current", pvV:"inverter_pv_input_voltage", pvA:"inverter_pv_input_current",
  gridV:"inverter_grid_voltage", outV:"inverter_ac_output_voltage", busV:"inverter_bus_voltage",
  gridHz:"inverter_grid_frequency", outHz:"inverter_ac_output_frequency", temp:"inverter_heatsink_temperature",
  chg:"inverter_battery_charge_current", dis:"inverter_battery_discharge_current",
  netbat:"inverter_battery_voltage * (inverter_battery_charge_current - inverter_battery_discharge_current)",
  battdis:"inverter_battery_voltage * inverter_battery_discharge_current",
  grid:"clamp_min(inverter_ac_output_active_power + (inverter_battery_voltage*inverter_battery_charge_current) - (inverter_pv_input_voltage*inverter_pv_input_current) - (inverter_battery_voltage*inverter_battery_discharge_current),0)",
  selfnow:"clamp_max(100*(inverter_pv_input_voltage*inverter_pv_input_current)/inverter_ac_output_active_power,100)",
  pf:"inverter_ac_output_active_power / inverter_ac_output_apparent_power", mode:"mode_value", fault:"fault_value", pvtot:"energy_value",
  avg1h:"avg_over_time(inverter_ac_output_active_power[1h])", avg24h:"avg_over_time(inverter_ac_output_active_power[24h])",
};
// energy over a window: lifetime-counter delta (live) OR integral of power (historical backfill, where the counters don't exist). kWh either way.
const eFromP=(c,p,w)=>`(max_over_time(${c}[${w}s]) - min_over_time(${c}[${w}s])) or (avg_over_time((${p})[${w}s]) * ${w}/3600000)`;
const dv={
  cons:w=>eFromP("energymeter_consumed_total","inverter_ac_output_active_power",w),
  pv:w=>eFromP("energymeter_pv_total","inverter_pv_input_voltage*inverter_pv_input_current",w),
  bat:w=>eFromP("energymeter_battery_out_total","inverter_battery_voltage*inverter_battery_discharge_current",w),
  grid:w=>eFromP("energymeter_grid_total",M.grid,w),
  self:w=>`clamp_max(100*(${eFromP("energymeter_pv_total","inverter_pv_input_voltage*inverter_pv_input_current",w)})/(${eFromP("energymeter_consumed_total","inverter_ac_output_active_power",w)}),100)`,
  peakLoad:w=>`max_over_time(inverter_ac_output_active_power[${w}s])`,
  pvPeak:w=>`max_over_time((inverter_pv_input_voltage*inverter_pv_input_current)[${w}s:2m])`,
  minSoc:w=>`min_over_time(inverter_battery_capacity[${w}s])`,
  uptime:w=>`avg_over_time((inverter_grid_voltage > bool 50)[${w}s:1m])*100`,
};
dv.gridCost=w=>`(${dv.grid(w)})*${TARIFF}`;
dv.savings=w=>`clamp_min((${dv.cons(w)})-(${dv.grid(w)}),0)*${TARIFF}`;
dv.total=w=>`(${dv.cons(w)})*${TARIFF}`;
// solar potential energy (kWh) from the weather ceiling, and how much of it was actually captured
dv.potential=w=>`avg_over_time(weather_pv_potential_w[${w}s]) * ${w}/3600000`;
// "wasted"/"captured" are derived CLIENT-side (CLIENT.wastedKwh / capturedPct): subtracting
// weather_* by inverter_* inside MetricsQL fails — the two carry different `topic` labels, so
// VM rejects the binary op with 422 (surfaced as a 502 through the poller proxy).
// "today" = delta of the monotonic lifetime counters since local midnight (robust to poller restarts;
// matches the Energy tiles when the Today preset is selected). Ignores the passed window.
const todaySec=()=>Math.max(60,Math.round((Date.now()-new Date().setHours(0,0,0,0))/1000));
const etDelta=m=>`max_over_time(${m}[${todaySec()}s]) - min_over_time(${m}[${todaySec()}s])`;

// weather (cloud cover) from Open-Meteo — free, no key, CORS-enabled; optional
let WEATHER=null;
async function fetchWeather(){ if(PVLAT==null||PVLON==null){ WEATHER=null; return; }
  const tilt=Math.round(PVTILT==null?30:PVTILT), omaz=Math.round((PVAZ==null?180:PVAZ)-180);  // Open-Meteo azimuth: 0=S,+W
  try{ const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${PVLAT}&longitude=${PVLON}&current=cloud_cover,temperature_2m&hourly=global_tilted_irradiance,cloud_cover,temperature_2m&tilt=${tilt}&azimuth=${omaz}&past_days=2&forecast_days=2&timezone=GMT`);
    const j=await r.json(); const w=j.current?{cloud:j.current.cloud_cover,temp:j.current.temperature_2m}:{};
    if(j.hourly&&j.hourly.time){ w.gti=j.hourly.time.map((t,i)=>[Date.parse(t+"Z"),j.hourly.global_tilted_irradiance[i]]).filter(p=>p[1]!=null);
      w.cloudH=j.hourly.time.map((t,i)=>[Date.parse(t+"Z"),j.hourly.cloud_cover[i]]);
      w.tempH=j.hourly.time.map((t,i)=>[Date.parse(t+"Z"),j.hourly.temperature_2m[i]]); }
    WEATHER=w; }catch(e){} }
function gtiAt(ms){ if(!WEATHER||!WEATHER.gti||!WEATHER.gti.length)return null; const h=WEATHER.gti;
  if(ms<h[0][0]||ms>h[h.length-1][0]){ let b=null,bd=1e15; for(const[t,v]of h){const d=Math.abs(t-ms);if(d<bd){bd=d;b=v;}} return bd<5400000?b:null; }
  for(let i=1;i<h.length;i++){ if(h[i][0]>=ms){ const[t0,v0]=h[i-1],[t1,v1]=h[i],f=(ms-t0)/(t1-t0||1); return v0+(v1-v0)*f; } } return null; }
function cloudFactor(c){ if(c==null)return 1; const N=Math.max(0,Math.min(1,c/100)); return 1-0.75*Math.pow(N,3.4); }
function cloudAt(ms){ if(!WEATHER)return null; const h=WEATHER.cloudH; if(!h||!h.length)return WEATHER.cloud;
  let b=null,bd=1e15; for(const[t,c]of h){const d=Math.abs(t-ms);if(d<bd){bd=d;b=c;}} return bd<5400000?b:WEATHER.cloud; }
function tempAt(ms){ if(!WEATHER)return null; const h=WEATHER.tempH; const cur=WEATHER.temp==null?null:WEATHER.temp; if(!h||!h.length)return cur;
  if(ms<h[0][0]||ms>h[h.length-1][0]){ let b=null,bd=1e15; for(const[t,v]of h){const d=Math.abs(t-ms);if(v!=null&&d<bd){bd=d;b=v;}} return bd<5400000?b:cur; }
  for(let i=1;i<h.length;i++){ if(h[i][0]>=ms){ const[t0,v0]=h[i-1],[t1,v1]=h[i]; if(v0==null||v1==null)return v0==null?v1:v0; return v0+(v1-v0)*(ms-t0)/(t1-t0||1); } } return cur; }

    for(const [t,v] of pv){ const a=pvPotentialAt(new Date(t)); if(a!=null) wh+=Math.max(0,a-v)*step/3600; } return wh/1000; },
  solarToday: async()=>{ if(pvPotentialW()==null)return null; const from=new Date().setHours(0,0,0,0),to=from+864e5,step=300000; let wh=0;   // modelled available solar for the WHOLE day (forecast for the hours not yet passed)

  solarTomorrow: async()=>{ if(pvPotentialW()==null)return null; const from=new Date().setHours(0,0,0,0)+864e5,to=from+864e5,step=300000; let wh=0;   // forecast solar potential for tomorrow (needs forecast_days=2)
    for(let t=from;t<to;t+=step){ const a=pvPotentialAt(new Date(t)); if(a!=null) wh+=a*step/3600000; } return wh/1000; },
  // today's net forecast error over the measurable (maxed) periods, as a % — same rule as the shaded chart
  // summed: (Σ produced − Σ min(predicted,load)) / Σ min(predicted,load).  − = model over-predicts, + = under-predicts
  errPctToday: async()=>{ if(pvPotentialW()==null)return null;
    const to=Date.now(), from=new Date().setHours(0,0,0,0), step=300;
    const [pv,ld]=await Promise.all([qRange(`avg_over_time((${M.pvpow})[${step}s])`,from,to,step),

    const [pv,av,ld]=await Promise.all([

      qRange(`avg_over_time((inverter_ac_output_active_power)[${step}s])`,from,to,step)]);

function renderSky(c){ const el=c.el;

    for(let m=0;m<=1440;m+=10){ const d=new Date(y0.getTime()+m*60000), s=solarElevAz(PVLAT,PVLON,d);
      if(s.el>0)path.push(s); if(prev<0&&s.el>=0&&!rise)rise=d; if(prev>=0&&s.el<0&&!set&&rise)set=d; prev=s.el; }

  const W=320,H=150,pl=6,pr=6,ptp=10,pb=22,gw=W-pl-pr,gh=H-ptp-pb,A0=60,A1=300,E1=70;

  const grid=cssVar('--grid'),muted=cssVar('--muted'); const names={90:'E',135:'SE',180:'S',225:'SW',270:'W'};

  if(path.length) s+='<path d="'+path.map((p,i)=>(i?'L':'M')+X(p.az).toFixed(1)+' '+Y(p.el).toFixed(1)).join(' ')+'" fill="none" stroke="#f59e0b" stroke-width="2" opacity="'+(WEATHER&&WEATHER.cloud!=null?(1-WEATHER.cloud/150).toFixed(2):'0.9')+'"/>';

  if(sn.el>0) s+='<circle cx="'+X(sn.az)+'" cy="'+Y(sn.el)+'" r="6" fill="#fbbf24" stroke="#f59e0b"/>';
  s+='</svg>';

     '<span>'+(cl!=null?'☁ '+cl+'%':'')+(tp!=null?' · '+tp.toFixed(0)+'°C':'')+'</span>'+

async function refresh(){ const now=Date.now(),{from,to}=range(),st=stepSec(),{evalT,win}=windowSec();
  try{ drawTimeline(); }catch(e){}
  const histView=to<now-2*86400000;   // whole visible window older than ~2 days -> historical (~5-min cloud data + backfilled weather)
  const aw=histView?Math.max(st,360):st;   // aggregate over >=6 min so every step point catches a sample -> lines stay visible when zoomed in; live data uses st unchanged
  { const lu=document.getElementById("lastUpd"); if(lu)lu.textContent="⟳ "+new Date().toLocaleTimeString(); }
  await Promise.all(cards.slice().sort((a,b)=>(a.p.t==="chart"?0:1)-(b.p.t==="chart"?0:1)).map(async c=>{ const p=c.p;   // fetch time charts first (they're what a zoom/pan changes) so they refill fastest
    if(p.t==="chart"){ c.chart.stepMs=st*1000;
      if(p.kind==="bars"){ const B=chooseBucket((to-from)/1000); c.chart.bucketMs=B*1000;
        const series=await Promise.all(p.series.map(async s=>{ const base=s.counter?`max_over_time(${s.counter}[${B}s]) - min_over_time(${s.counter}[${B}s])`+(s.power?` or (avg_over_time((${s.power})[${B}s:300s]) * ${B}/3600000)`:``):`avg_over_time((${s.power})[${B}s:300s]) * ${B}/3600000`; const q=s.cost?`(${base})*${TARIFF}`:base; return {...s, pts:(await qRange(q, from, to, B)).map(pt=>[pt[0]-B*500, pt[1]])}; })); c.chart.setData(series); }
      else if(p.pvhead){ const conf=pvPotentialW()!=null, ww=Math.max(st,3900);   // available always from the DB (same source/window as the GTI chart) so the two can't diverge
        const [pv,availVM,ld]=await Promise.all([
          qRange(`${AGG}_over_time((${M.pvpow})[${aw}s])`,from,to,st),
          qRange(`avg_over_time(weather_pv_potential_w[${ww}s])`,from,to,st),
          qRange(`${AGG}_over_time((inverter_ac_output_active_power)[${aw}s])`,from,to,st) ]);   // house load
        const availM=new Map((availVM||[]).map(p=>[p[0],p[1]])), ldM=new Map((ld||[]).map(p=>[p[0],p[1]])), ldA=ld||[];
        const loadAt=(t)=>{ const e=ldM.get(t); if(e!=null)return e;   // raw load where present; ONLY if a bucket is missing, use the mean of the two nearest samples (no smoothing of real values)
          let lo=0,hi=ldA.length-1,bi=-1; while(lo<=hi){const m=(lo+hi)>>1; if(ldA[m][0]<=t){bi=m;lo=m+1;}else hi=m-1;}
          const b=bi>=0?ldA[bi]:null, u=bi+1<ldA.length?ldA[bi+1]:null; return b&&u?(b[1]+u[1])/2:(b||u||[0,0])[1]; };
        const avail=[], under=[], over=[];
        for(const [t,v] of pv){ const a=availM.has(t)?availM.get(t):(conf?pvPotentialAt(new Date(t)):null);   // DB potential; client model only fills the last point if the DB hasn't written it yet
          if(a==null) continue; avail.push([t,a]);
          const l=loadAt(t), thr=l<500?250:100, ceil=Math.min(a,l);   // raw load (interpolated only when a bucket is missing)
          const isU=v>a, isO=v<a && (l-v)>thr;   // GREEN: produced beat the forecast -> always real (making more than predicted can't be curtailment). RED: below forecast AND load outran output (proves not throttled)
          under.push([t, v, isU?a:v, isU?v-a:0]);        // GREEN band: produced(top)..predicted(bottom); zero-height otherwise — DENSE (a point every step) so it never bridges over the opposite colour
          over.push([t, isO?ceil:v, v, isO?v-ceil:0]);   // RED band: min(predicted,load)(top)..produced(bottom); zero-height otherwise
        }
        c.chart.setData([{...p.series[0],pts:pv},{...p.series[1],pts:avail},{...p.series[2],pts:ld||[]},{...p.series[3],pts:under},{...p.series[4],pts:over}]); }
      else { const series=await Promise.all(p.series.map(async s=>{ if(s.avail) return {...s,pts:await qRange(`avg_over_time(weather_pv_potential_w[${Math.max(st,3900)}s])`,from,to,st)};   // always from the DB (recent + historical) -> matches the GTI chart
        const ag=s.agg||p.agg||AGG; const w2=s.wx?Math.max(st,3900):aw; return {...s,pts:await qRange(`${ag}_over_time((${s.expr})[${w2}s])`,from,to,st)}; })); c.chart.setData(series); }
    } else if(p.t==="info"){ try{ c.last=await (await fetch("/info")).json(); }catch(e){} renderInfo(c); }
    else if(p.t==="sky"){ renderSky(c); }
    else if(p.t==="multi"){ c.last=await Promise.all(p.items.map(it=> it.client?CLIENT[it.client](win,evalT):qInstant(it.dyn?it.dyn(win):it.expr, it.dyn?(p.now?now:evalT):now))); renderMulti(c); }
    else if(p.t==="table"){ c.last=await Promise.all(p.rows.map(r=>Promise.all(r.cells.map(cell=>qInstant(cell.dyn?cell.dyn(win):cell.expr, cell.dyn?(p.now?now:evalT):now))))); renderTable(c); }
    else if(p.t==="cells"){ c.last=await Promise.all(Array.from({length:p.n},(_,i)=>qInstant(p.prefix+(i+1),now))); renderCells(c); }
    else if(p.t==="gauge"){ c.last=await qInstant(p.expr,now); if(p.optional)c.card.style.display=(c.last==null?"none":""); if(p.sub) c.subv=await qInstant(p.sub.dyn?p.sub.dyn(win):p.sub.expr, p.sub.dyn?evalT:now); if(p.maxExpr) c.maxv=await qInstant(p.maxExpr,now); renderGauge(c); }
    else if(p.t==="gauge2"){ c.last=await Promise.all(p.gauges.map(g=>qInstant(g.expr,now))); c.subv=await Promise.all(p.gauges.map(g=>g.sub?qInstant(g.sub.expr,now):null)); renderGauge2(c); }
    else if(p.client){ c.last=await CLIENT[p.client](win,evalT); renderStat(c); }
    else { const expr=p.dyn?p.dyn(win):p.expr, at=p.dyn?evalT:now; c.last=await qInstant(expr,at); renderStat(c); }
  }));
  try{ const age=await qInstant("time() - timestamp(inverter_battery_voltage)",Date.now()); document.getElementById("freshDot").className="dot"+((age==null||age>120)?" stale":""); }catch(e){}
  { try{ const w=await fetch("/warnings").then(r=>r.json()); renderFaults(w); }catch(e){} }
  { const tg=document.getElementById("bmsToggle"); if(tg){ const fresh=await qInstant("bms_soc and (time()-timestamp(bms_soc) < 90)",Date.now()); const on=fresh!=null; tg.dataset.on=on?"1":"0"; tg.textContent="⏻ BMS"; tg.style.color=on?"var(--good)":"var(--muted)"; tg.style.borderColor=on?"var(--good)":"var(--grid)"; } }
  { const bt=document.getElementById("battModeToggle"); if(bt && bt.textContent!=="⏳"){ try{ const j=await (await fetch("/battery")).json(); applyBattMode(j.battery_mode); }catch(e){} } }
  loadMode();
}

async function loadMode(){ try{ const j=await (await fetch("/control")).json(); setBadge(j.mode); }catch(e){} }
function setBadge(m){ const b=document.getElementById("modeBadge"); b.className="badge "+(m||"unknown"); b.textContent=(m||"?").toUpperCase(); }
document.querySelectorAll(".modebtn").forEach(btn=>btn.addEventListener("click",async()=>{ const m=btn.dataset.mode; if(!confirm("Switch to "+m.toUpperCase()+"?\nThe dongle reconnect can take up to ~2 min."))return; try{ const j=await (await fetch("/control/"+m)).json(); setBadge(j.mode); }catch(e){} }));

function markPreset(el){ document.querySelectorAll("#presets button").forEach(b=>b.classList.toggle("on",b===el)); }
function setPreset(dur){ state.kind="preset"; state.dur=dur; state.abs=null; state.custom=false; markPreset([...document.querySelectorAll("#presets button")].find(b=>+b.dataset.dur*1000===dur)); updateCustomBtn(); recordHist(); refresh(); }
function setToday(){ state.kind="today"; state.abs=null; state.custom=false; markPreset(document.querySelector('#presets [data-today]')); updateCustomBtn(); recordHist(); refresh(); }
function setAbs(from,to){ state.kind="abs"; state.abs={from,to}; state.custom=true; markPreset(null); updateCustomBtn(); recordHist(); refresh(); }
function addCal(ms,unit,n){ const d=new Date(ms); if(unit==="d")d.setDate(d.getDate()+n); else if(unit==="M")d.setMonth(d.getMonth()+n); else if(unit==="y")d.setFullYear(d.getFullYear()+n); return d.getTime(); }
function shiftRange(unit,n){ const r=range(); let nf=addCal(r.from,unit,n),nt=addCal(r.to,unit,n); const now=Date.now(); if(nt>now){ const w=nt-nf; nt=now; nf=now-w; } setAbs(nf,nt); }   // shift the window by day/month/year, keep its width, never past now
function isLive(){ return state.kind==="preset" || state.kind==="today" || (state.abs && state.abs.to>=Date.now()); }   // presets & today always live; custom range live only while it includes now
function tick(){ if(isLive()) refresh(); }   // auto-refresh skips static (past) custom ranges
function fmtDT(t){ const d=new Date(t),p=n=>String(n).padStart(2,"0"); return p(d.getDate())+"."+p(d.getMonth()+1)+"."+d.getFullYear()+" "+p(d.getHours())+":"+p(d.getMinutes()); }
// live (preset/today) -> calendar icon; a fixed picked period -> show the range text
function updateCustomBtn(){ const b=document.getElementById("customBtn"); b.classList.toggle("on",state.custom); if(state.custom){ const r=range(); b.textContent=fmtDT(r.from)+" – "+fmtDT(r.to); b.style.fontSize=".72rem"; b.title="Custom period — click to change"; } else { b.textContent="Custom"; b.style.fontSize=""; b.title="Custom period — pick dates"; } }
// undo/redo of the visible period (Cmd/Ctrl+Z, Cmd/Ctrl+Shift+Z) — covers presets, calendar and chart drag-zoom
let rangeHist=[], rangeIdx=-1;
function snapState(){ return {kind:state.kind, dur:state.dur, abs:state.abs?{from:state.abs.from,to:state.abs.to}:null, custom:state.custom}; }
function recordHist(){ const s=snapState(); if(rangeIdx>=0 && JSON.stringify(rangeHist[rangeIdx])===JSON.stringify(s))return; rangeHist=rangeHist.slice(0,rangeIdx+1); rangeHist.push(s); if(rangeHist.length>100)rangeHist.shift(); rangeIdx=rangeHist.length-1; }
function applyHist(s){ state.kind=s.kind; state.dur=s.dur; state.abs=s.abs?{from:s.abs.from,to:s.abs.to}:null; state.custom=s.custom;
  if(s.kind==="preset")markPreset([...document.querySelectorAll("#presets button")].find(b=>+b.dataset.dur*1000===s.dur));
  else if(s.kind==="today")markPreset(document.querySelector('#presets [data-today]')); else markPreset(null);
  updateCustomBtn(); refresh(); }
function undoRange(){ if(rangeIdx>0){ rangeIdx--; applyHist(rangeHist[rangeIdx]); } }
function redoRange(){ if(rangeIdx<rangeHist.length-1){ rangeIdx++; applyHist(rangeHist[rangeIdx]); } }
document.querySelectorAll("#presets button[data-dur],#presets button[data-today]").forEach(b=>b.addEventListener("click",()=>{ b.dataset.today?setToday():setPreset(+b.dataset.dur*1000); }));
document.querySelectorAll("#shiftSel button[data-shift]").forEach(b=>b.addEventListener("click",()=>shiftRange(b.dataset.shift, +b.dataset.n)));
function setThisPeriod(unit){ const d=new Date((range().from+range().to)/2); d.setHours(0,0,0,0);   // snap to the whole current day/week/month/year around the period you're viewing
  if(unit==="week") d.setDate(d.getDate()-((d.getDay()+6)%7));   // back to Monday
  else if(unit==="month") d.setDate(1);
  else if(unit==="year") d.setMonth(0,1);
  const from=d.getTime(), e=new Date(from);   // end = start of the next period − 1 ms (DST-safe via Date arithmetic)
  if(unit==="week") e.setDate(e.getDate()+7); else if(unit==="month") e.setMonth(e.getMonth()+1); else if(unit==="year") e.setFullYear(e.getFullYear()+1); else e.setDate(e.getDate()+1);
  setAbs(from, e.getTime()-1); }
document.querySelectorAll("#snapSel button").forEach(b=>b.addEventListener("click",()=>setThisPeriod(b.dataset.snap)));

// ---------- bottom timeline brush (overview strip = ~6× the window so the handle stays grabbable at any zoom) ----------
var TLCTX=null, tlDrag=null, tlMoved=false;
function tlContext(){ const {from,to}=range(), now=Date.now(), span=Math.max(to-from,60e3), ctx=Math.max(span*6, 12*3600e3);
  // static/snapped range (incl. this-week/month/year, which end in the future) -> CENTRE it in the strip;
  // live preset -> pin the window near the right edge ('now'), with a small future margin.
  const end = state.kind==="abs" ? (from+to)/2 + ctx/2 : now + (ctx-span)*0.06;
  return {start:end-ctx, span:ctx}; }
function tlBox(from,to,c){ const win=document.getElementById("tbWin"); if(!win)return;
  const L=Math.max(0,(from-c.start)/c.span), R=Math.min(1,(to-c.start)/c.span);
  win.style.left=(L*100)+"%"; win.style.width=(Math.max(0,R-L)*100)+"%"; }
function tlTicks(from,to){ const span=to-from, off=new Date().getTimezoneOffset()*60000, p=n=>String(n).padStart(2,"0"),
    mo=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"], maj=[], min=[],
    aM=(v,l)=>{ if(v>=from&&v<=to)maj.push({t:v,l}); }, am=v=>{ if(v>=from&&v<=to)min.push(v); },
    fixed=(s,f)=>{ for(let v=Math.ceil((from-off)/s)*s+off;v<=to;v+=s) f(v); };
  if(span<=2*864e5){ const mS=span<=6*3600e3?3600e3:(span<=864e5?3*3600e3:6*3600e3), nS=span<=6*3600e3?900e3:3600e3;   // hours; minor 15min/1h
    fixed(mS,v=>{const d=new Date(v); aM(v,p(d.getHours())+":"+p(d.getMinutes()));}); fixed(nS,am); }
  else if(span<=70*864e5){ const days=span<=14*864e5?1:span<=35*864e5?3:7, nS=days===1?6*3600e3:864e5;   // days; minor 6h/1d
    for(let v=Math.ceil((from-off)/864e5)*864e5+off;v<=to;v+=864e5){ if(Math.round((v-off)/864e5)%days===0){const d=new Date(v); aM(v,p(d.getDate())+"."+p(d.getMonth()+1));} } fixed(nS,am); }
  else if(span<=800*864e5){ const stepM=span<=200*864e5?1:span<=400*864e5?2:3;   // months; minor month/week
    const d=new Date(from); d.setDate(1); d.setHours(0,0,0,0); while(d.getTime()<=to){ aM(d.getTime(), mo[d.getMonth()]+" "+String(d.getFullYear()).slice(2)); d.setMonth(d.getMonth()+stepM); }
    if(stepM>1){ const m=new Date(from); m.setDate(1); m.setHours(0,0,0,0); while(m.getTime()<=to){ am(m.getTime()); m.setMonth(m.getMonth()+1); } } else fixed(7*864e5,am); }
  else { const stepY=span<=4*365*864e5?1:2;   // years; minor months
    const d=new Date(from); d.setMonth(0,1); d.setHours(0,0,0,0); while(d.getTime()<=to){ aM(d.getTime(), String(d.getFullYear())); d.setFullYear(d.getFullYear()+stepY); }
    const m=new Date(from); m.setDate(1); m.setHours(0,0,0,0); const sm=stepY===1?1:3; while(m.getTime()<=to){ am(m.getTime()); m.setMonth(m.getMonth()+sm); } }
  return {maj,min}; }
function drawTimeline(){ if(tlDrag)return; const strip=document.getElementById("tbStrip"); if(!strip)return;
  TLCTX=tlContext(); const c=TLCTX, {from,to}=range(), tk=tlTicks(c.start,c.start+c.span), pc=t=>((t-c.start)/c.span*100).toFixed(2);
  document.getElementById("tbTicks").innerHTML =
    tk.min.map(t=>`<span class="min" style="left:${pc(t)}%"></span>`).join("") +
    tk.maj.map(t=>`<span class="maj" style="left:${pc(t.t)}%"></span>`).join("");
  document.getElementById("tbAxis").innerHTML=tk.maj.map(t=>`<span style="left:${pc(t.t)}%">${t.l}</span>`).join("");
  const now=Date.now(), nx=(now-c.start)/c.span, nm=document.getElementById("tbNow");
  if(nx>=0&&nx<=1){ nm.style.display="block"; nm.style.left=(nx*100)+"%"; } else nm.style.display="none";
  tlBox(from,to,c); }
function tlDown(e,mode){ e.preventDefault(); e.stopPropagation(); const {from,to}=range();
  TLCTX=tlContext(); tlMoved=false; tlDrag={mode,px0:e.clientX,w:document.getElementById("tbStrip").getBoundingClientRect().width||1,from,to,cur:{from,to}};
  addEventListener("pointermove",tlMove); addEventListener("pointerup",tlUp); }
function tlMove(e){ if(!tlDrag)return; tlMoved=true; const dt=(e.clientX-tlDrag.px0)/tlDrag.w*TLCTX.span, now=Date.now(), minW=15*60e3;
  let from=tlDrag.from, to=tlDrag.to;
  if(tlDrag.mode==="pan"){ let nf=from+dt, nt=to+dt; if(nt>now){nt=now; nf=now-(to-from);} from=nf; to=nt; }
  else if(tlDrag.mode==="l") from=Math.min(from+dt, to-minW);
  else if(tlDrag.mode==="r") to=Math.min(Math.max(to+dt, from+minW), now);
  tlDrag.cur={from,to}; tlBox(from,to,TLCTX); const cb=document.getElementById("customBtn"); if(cb){ cb.textContent=fmtDT(from)+" – "+fmtDT(to); cb.style.fontSize=".72rem"; } }
function tlUp(){ removeEventListener("pointermove",tlMove); removeEventListener("pointerup",tlUp); const d=tlDrag; tlDrag=null; if(d&&d.cur) setAbs(Math.round(d.cur.from),Math.round(d.cur.to)); }
function tlClick(e){ if(tlMoved){ tlMoved=false; return; }   // ignore the click that follows a drag
  if(e.target.closest("#tbWin"))return; const strip=document.getElementById("tbStrip"), rect=strip.getBoundingClientRect(), c=tlContext();
  const t=c.start+(e.clientX-rect.left)/(rect.width||1)*c.span, {from,to}=range(), half=(to-from)/2, now=Date.now();
  let nf=t-half, nt=t+half; if(nt>now){nt=now; nf=now-(to-from);} setAbs(Math.round(nf),Math.round(nt)); }
function tlZoom(f){ const {from,to}=range(), ctr=(from+to)/2, w=(to-from)*f, now=Date.now(); let nf=ctr-w/2, nt=ctr+w/2; if(nt>now){nt=now; nf=nt-w;} setAbs(Math.round(nf),Math.round(nt)); }

const pop=document.getElementById("popover"),cbtn=document.getElementById("customBtn"); const toInput=ms=>new Date(ms-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);
cbtn.addEventListener("click",()=>{ const open=!pop.classList.contains("open"); if(open){ const {from,to}=range(); document.getElementById("cfrom").value=toInput(from); document.getElementById("cto").value=toInput(to); const r=cbtn.getBoundingClientRect(); pop.style.left=Math.max(6,Math.min(r.left,innerWidth-258))+"px"; pop.style.bottom=(innerHeight-r.top+6)+"px"; popValidate(); calOpen(); } pop.classList.toggle("open",open); });   // always open the picker; reset to live is done via a preset (e.g. 6h)
const cfrom=document.getElementById("cfrom"), cto=document.getElementById("cto"), capply=document.getElementById("capply"), poperr=document.getElementById("poperr");
function popValidate(){ const f=new Date(cfrom.value).getTime(), t=new Date(cto.value).getTime(), ok=isFinite(f)&&isFinite(t)&&t>f; poperr.textContent=(isFinite(f)&&isFinite(t)&&t<=f)?"«To» must be after «From»":""; capply.disabled=!ok; capply.style.opacity=ok?"":".5"; }

// ---- range calendar (two-click: click start day, click end day; hover previews; future days disabled) ----
var calView=null, calAnchor=null, calSel=null, calHover=null, calData=new Map(), calApprox=new Set(), calPresence=new Set(), calSeq=0, calCache=new Map();
const dayStart=ms=>{ const d=new Date(ms); d.setHours(0,0,0,0); return d.getTime(); };
function renderCal(){ const grid=document.getElementById("calGrid"); if(!grid||!calView)return;
  document.getElementById("calM").textContent=calView.toLocaleString([], {month:"long", year:"numeric"});
  const wd=["Mo","Tu","We","Th","Fr","Sa","Su"]; let html=wd.map(w=>`<span class="wd">${w}</span>`).join("");
  const gs=new Date(calView); gs.setDate(1-((gs.getDay()+6)%7)); const today=dayStart(Date.now()), mo=calView.getMonth();
  let a=calSel?calSel.start:null, b=calSel?calSel.end:null; if(calAnchor!=null&&calHover!=null){ a=Math.min(calAnchor,calHover); b=Math.max(calAnchor,calHover); }
  for(let i=0;i<42;i++){ const d=new Date(gs); d.setDate(gs.getDate()+i); const ds=d.getTime(), cls=["d"];
    if(d.getMonth()!==mo)cls.push("oth"); if(ds===today)cls.push("today"); if(ds>today)cls.push("fut");
    if(a!=null){ if(ds===a||ds===b)cls.push("edge"); else if(ds>a&&ds<b)cls.push("inrange"); }
    const g=calData.get(ds); let dot="", tip="";
    if(g!=null&&g>0.05){ dot=`<i class="dd" style="opacity:${(0.35+Math.min(1,g/10)*0.65).toFixed(2)}"></i>`; tip=` title="${calApprox.has(ds)?'~'+g.toFixed(1)+' kWh (backfill, to battery)':g.toFixed(1)+' kWh solar'}"`; }   // green = energy recorded, intensity ~ kWh
    else if(calPresence.has(ds)){ dot=`<i class="dd gray"></i>`; tip=` title="data — no energy recorded"`; }                                        // gray = inverter data exists but no energy
    html+=`<span class="${cls.join(" ")}" data-d="${ds}"${tip}>${d.getDate()}${dot}</span>`; }
  grid.innerHTML=html; }
function calOpen(){ const {from,to}=range(); calSel={start:dayStart(from), end:dayStart(to)}; calAnchor=null; calHover=null; calView=new Date(from); calView.setDate(1); calView.setHours(0,0,0,0); renderCal(); calLoadData(); }
async function calLoadData(){ if(!calView)return; const gs=new Date(calView); gs.setDate(1-((gs.getDay()+6)%7)); const from=dayStart(gs.getTime());
  const apply=o=>{ calData=o.green; calApprox=o.approx; calPresence=o.has; renderCal(); };
  if(calCache.has(from)){ apply(calCache.get(from)); return; }   // past months are immutable → reuse
  const seq=++calSeq, now=Date.now(), to=Math.min(from+43*864e5, now); if(to<=from){ calData=new Map(); calApprox=new Set(); calPresence=new Set(); renderCal(); return; }
  try{
    const [mids,chg,pres,cur]=await Promise.all([
      qRange(`last_over_time(energymeter_pv_total[1800s])`, from, to, 86400),          // lifetime PV-kWh counter at each local midnight (accurate, live era)
      qRange(`integrate(inverter_pv_charging_power[86400s])/3.6e6`, from, to, 86400),   // backfill fallback: time-weighted charging energy (kWh), robust to sample density; pre-counter days stored pv current=0 so pvpow is useless there
      qRange(`count_over_time(inverter_battery_voltage[86400s])`, from, to, 86400),     // any inverter data that day? (battery V is always present when up)
      qInstant(`energymeter_pv_total`, now)]);                                          // current counter → today's partial
    if(seq!==calSeq)return;
    const green=new Map(), approx=new Set();
    for(let i=0;i+1<mids.length;i++){ if(mids[i+1][0]-mids[i][0]>1.5*864e5)continue; const k=mids[i+1][1]-mids[i][1]; if(k>=0) green.set(dayStart(mids[i][0]), k); }   // day = counter delta between midnights
    if(mids.length){ const L=mids[mids.length-1], t=dayStart(L[0]); if(t===dayStart(now)&&cur!=null&&cur-L[1]>=0) green.set(t, cur-L[1]); }   // today so far
    for(const [T,v] of chg){ const d=dayStart(T-12*3600e3); if(!green.has(d)&&v>0.1){ green.set(d, v); approx.add(d); } }   // fill counter-less (backfill) days
    const has=new Set(); for(const [T,c] of pres){ if(c>0) has.add(dayStart(T-12*3600e3)); } has.add(dayStart(now));
    const o={green,approx,has}; if(from+43*864e5<=now) calCache.set(from,o);   // cache only fully-past grids; the current month keeps updating
    apply(o); }catch(e){} }
function calSyncInputs(){ if(!calSel)return; cfrom.value=toInput(calSel.start); cto.value=toInput(calSel.end+86400000-1); popValidate(); }
function calFromInputs(){ const f=new Date(cfrom.value).getTime(), t=new Date(cto.value).getTime(); if(isFinite(f)&&isFinite(t)){ calSel={start:dayStart(f),end:dayStart(t)}; calAnchor=null; renderCal(); } }
function calPick(ds){ if(ds>dayStart(Date.now()))return;
  if(calAnchor==null){ calAnchor=ds; calSel={start:ds,end:ds}; }
  else { calSel={start:Math.min(calAnchor,ds), end:Math.max(calAnchor,ds)}; calAnchor=null; calSyncInputs(); }
  renderCal(); }
const calGrid=document.getElementById("calGrid");
calGrid.addEventListener("click",e=>{ e.stopPropagation(); const c=e.target.closest(".d"); if(c&&!c.classList.contains("fut"))calPick(+c.dataset.d); });   // stop bubbling: renderCal() replaces the clicked node, so the global outside-click handler would otherwise see a detached target and close the popup
calGrid.addEventListener("mouseover",e=>{ const c=e.target.closest(".d"); if(c&&calAnchor!=null){ const h=+c.dataset.d; if(h!==calHover){ calHover=h; renderCal(); } } });
calGrid.addEventListener("mouseleave",()=>{ if(calAnchor!=null&&calHover!=null){ calHover=null; renderCal(); } });
document.getElementById("calPrev").addEventListener("click",()=>{ calView.setMonth(calView.getMonth()-1); renderCal(); calLoadData(); });
document.getElementById("calNext").addEventListener("click",()=>{ calView.setMonth(calView.getMonth()+1); renderCal(); calLoadData(); });

cfgBtn.addEventListener("click",()=>{ const open=!cfgPop.classList.contains("open"); if(open){ const S=(id,v)=>document.getElementById(id).value=(v==null?"":v); S("tariff",TARIFF||""); document.getElementById("currency").value=CUR; S("pvmax",PVMAX||""); S("pvlat",PVLAT); S("pvlon",PVLON); S("pvkwp",PVKWP||""); S("pvtilt",PVTILT); S("pvaz",PVAZ); document.getElementById("agg").value=AGG; } cfgPop.classList.toggle("open",open); cfgBtn.classList.toggle("on",open); });

  TARIFF=parseFloat(V("tariff"))||0; CUR=V("currency")||"₴"; PVMAX=parseFloat(V("pvmax"))||0; localStorage.setItem("tariff",TARIFF); localStorage.setItem("currency",CUR); localStorage.setItem("pvmax",PVMAX);
  PVLAT=setNum("pvlat","pvlat"); PVLON=setNum("pvlon","pvlon"); PVKWP=setNum("pvkwp","pvkwp")||0; PVTILT=setNum("pvtilt","pvtilt"); PVAZ=setNum("pvaz","pvaz");

  cards.forEach(c=>{ if(c.chart){ c.chart.draw(); c.legItems.forEach(l=>l.ic.style.background=resolveColor(l.color)); } else if(c.p.t==="gauge") renderGauge(c); else if(c.p.t==="gauge2") renderGauge2(c); else if(c.p.t==="info") renderInfo(c); else if(c.p.t==="multi") renderMulti(c); else if(c.p.t==="table") renderTable(c); else if(c.p.t==="cells") renderCells(c); else if(c.p.t==="sky") renderSky(c); else renderStat(c); }); }

function showTip(el){ const t=el.dataset.tip; if(!t)return; tip.textContent=t; tip.style.display="block"; tip.dataset.for=t;
  const r=el.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;
