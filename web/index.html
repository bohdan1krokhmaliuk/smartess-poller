<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inverter</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E☀️%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f6fb; --panel:#ffffff; --panel2:#eef1f7; --text:#0f172a; --muted:#64748b;
  --border:#e2e8f0; --grid:#e7ebf3; --accent:#2563eb; --good:#16a34a; --warn:#f59e0b; --bad:#dc2626;
  --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
}
:root[data-theme=dark]{
  --bg:#0b1020; --panel:#111829; --panel2:#0e1524; --text:#e6ebf5; --muted:#8896ad;
  --border:#1e293b; --grid:#1b2437; --accent:#3b82f6; --good:#22c55e; --warn:#eab308; --bad:#ef4444;
  --shadow:0 1px 3px rgba(0,0,0,.4); color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme=light]){ color-scheme:dark;
  --bg:#0b1020; --panel:#111829; --panel2:#0e1524; --text:#e6ebf5; --muted:#8896ad;
  --border:#1e293b; --grid:#1b2437; --accent:#3b82f6; --good:#22c55e; --warn:#eab308; --bad:#ef4444;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}}
*{box-sizing:border-box} html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,system-ui,sans-serif;
  background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; padding-bottom:2rem}
header{position:sticky; top:0; z-index:20; background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(150%) blur(8px); border-bottom:1px solid var(--border);
  padding:.55rem clamp(.6rem,2vw,1.2rem); display:flex; flex-wrap:wrap; gap:.5rem .7rem; align-items:center}
body.kiosk header{display:none}
.brand{font-weight:700; font-size:1.05rem; margin-right:.2rem; display:flex; align-items:center; gap:.4rem}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.brand .dot.stale{background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 25%,transparent)}
.spacer{flex:1 1 auto}
.seg{display:inline-flex; background:var(--panel2); border:1px solid var(--border); border-radius:.6rem; overflow:hidden}
.seg button{appearance:none; border:0; background:transparent; color:var(--muted); padding:.34rem .58rem; font-size:.82rem; cursor:pointer; font-weight:600}
.seg button.on{background:var(--accent); color:#fff} .seg button:hover:not(.on){color:var(--text)}
.iconbtn{appearance:none; display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--border); background:var(--panel); color:var(--text); min-width:34px;height:32px; padding:0 .5rem; border-radius:.55rem; cursor:pointer; font-size:1rem; line-height:1}
.iconbtn.on{border-color:var(--accent); color:var(--accent)}
.rel{position:relative; display:inline-flex}
.popover{position:absolute; top:38px; right:0; background:var(--panel); border:1px solid var(--border); border-radius:.7rem; box-shadow:var(--shadow); padding:.7rem; display:none; z-index:30; min-width:220px}
.popover.open{display:block}
.popover label{display:block; font-size:.72rem; color:var(--muted); margin:.3rem 0 .1rem}
.popover input{width:100%; padding:.35rem; border:1px solid var(--border); border-radius:.4rem; background:var(--panel2); color:var(--text); font-size:.82rem}
.popover .apply{margin-top:.55rem; width:100%; border:0; background:var(--accent); color:#fff; padding:.45rem; border-radius:.5rem; font-weight:700; cursor:pointer}
.mode{display:inline-flex; align-items:center; gap:.35rem; font-size:.82rem; color:var(--muted)}
.badge{padding:.24rem .55rem; border-radius:.5rem; font-weight:700; font-size:.78rem; color:#fff; letter-spacing:.02em}
.badge.local{background:var(--accent)} .badge.mirror{background:var(--good)} .badge.unknown{background:var(--muted)}
.modebtn{appearance:none;border:1px solid var(--border);background:var(--panel);color:var(--text); padding:.28rem .5rem;border-radius:.5rem;font-size:.76rem;font-weight:600;cursor:pointer}
.modebtn:hover{border-color:var(--accent)}
main{padding:clamp(.6rem,2vw,1.1rem); max-width:1600px; margin:0 auto}
.section{margin:1.1rem 0 .5rem; font-size:.82rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; cursor:pointer; user-select:none; display:flex; align-items:center; gap:.4rem}
.section .caret{transition:transform .15s; font-size:.7rem} .section.collapsed .caret{transform:rotate(-90deg)}
.grid{display:grid; grid-template-columns:repeat(12,1fr); gap:.7rem}
.grid.hidden{display:none}
.card{grid-column:span 3; background:var(--panel); border:1px solid var(--border); border-radius:.8rem; box-shadow:var(--shadow); padding:.7rem .8rem; min-width:0; position:relative}
.card h3{margin:0 0 .3rem; font-size:.78rem; font-weight:600; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.card h3[data-tip]{text-decoration:underline dotted; text-decoration-color:var(--border); text-underline-offset:2px; cursor:help}
#tip{position:fixed; z-index:200; max-width:280px; background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:.5rem; padding:.5rem .6rem; font-size:.78rem; line-height:1.45; box-shadow:var(--shadow); display:none; pointer-events:none}
.card .val{font-size:clamp(1.3rem,2.4vw,1.9rem); font-weight:700; line-height:1.1; color:var(--text)}
.card.chart{grid-column:span 6}
.card.info{grid-column:span 12}
.card.info .val{font-size:.92rem; font-weight:600; color:var(--text)}
.card.info b{color:var(--muted); font-weight:600}
.chartwrap{position:relative; width:100%; height:200px; touch-action:pan-y}
.chartwrap.tl{height:70px}
.chartwrap canvas{position:absolute; inset:0; width:100%; height:100%}
.legend{display:flex; flex-wrap:wrap; gap:.15rem .8rem; margin-top:.3rem; font-size:.72rem; color:var(--muted)}
.legend span{display:inline-flex; align-items:center; gap:.3rem} .legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.tip{position:absolute; pointer-events:none; background:var(--panel); border:1px solid var(--border); border-radius:.5rem; padding:.4rem .55rem; font-size:.72rem; box-shadow:var(--shadow); z-index:5; opacity:0; transition:opacity .08s; min-width:120px}
.tip .t{color:var(--muted); margin-bottom:.25rem} .tip .row{display:flex; justify-content:space-between; gap:.8rem} .tip .row b{color:var(--text)}
.gauge{display:flex; flex-direction:column; align-items:center; justify-content:center} .gauge svg{width:100%; max-width:160px; height:auto}
.err{color:var(--bad); font-size:.75rem}
.banner{display:none; background:var(--bad); color:#fff; text-align:center; padding:.4rem; font-size:.82rem; font-weight:600}
.banner.show{display:block}
@media (max-width:820px){ .card{grid-column:span 6 !important} .card.chart,.card.info,.card.dual{grid-column:span 12 !important} }
</style>
</head>
<body>
<div class="banner" id="banner">⚠ No connection to the data source — retrying…</div>
<header>
  <div class="brand"><span class="dot" id="freshDot"></span> Inverter <span id="lastUpd" style="color:var(--muted);font-size:.68rem;font-weight:400"></span></div>
  <div class="mode">
    <span class="badge unknown" id="modeBadge">…</span>
    <button class="modebtn" data-mode="local" title="Fast 10s logging (app offline)">LOCAL</button>
    <button class="modebtn" data-mode="mirror" title="SmartESS app works">MIRROR</button>
  </div>
  <div class="spacer"></div>
  <div class="seg" id="presets">
    <button data-dur="900">15m</button><button data-dur="3600">1h</button>
    <button data-dur="21600" class="on">6h</button><button data-dur="86400">24h</button>
    <button data-dur="604800">7d</button><button data-dur="2592000">30d</button>
    <button data-dur="31536000">1y</button><button data-today="1">Today</button>
  </div>
  <span class="rel"><button class="iconbtn" id="customBtn" title="Pick a date range">📅</button>
    <div class="popover" id="popover"><label>From</label><input type="datetime-local" id="cfrom">
      <label>To</label><input type="datetime-local" id="cto"><button class="apply" id="capply">Apply</button></div></span>
  <div class="seg" id="shiftSel" title="Shift the visible window (keeps the same zoom)">
    <button data-shift="y" data-n="-1" title="−1 year">«Y</button><button data-shift="M" data-n="-1" title="−1 month">«M</button><button data-shift="d" data-n="-1" title="−1 day">«D</button>
    <button data-shift="d" data-n="1" title="+1 day">D»</button><button data-shift="M" data-n="1" title="+1 month">M»</button><button data-shift="y" data-n="1" title="+1 year">Y»</button>
  </div>
  <div class="seg" id="refreshSel">
    <button data-ms="0">⏸</button><button data-ms="10000">10s</button>
    <button data-ms="30000" class="on">30s</button><button data-ms="60000">1m</button>
  </div>
  <button class="iconbtn" id="refreshNow" title="Refresh now">⟳</button>
  <span class="rel"><button class="iconbtn" id="cfgBtn" title="Settings">⚙</button>
    <div class="popover" id="cfgPop"><label>Tariff (per kWh)</label><input type="number" step="0.01" id="tariff">
      <label>Currency</label><input type="text" id="currency" maxlength="4">
      <label>PV max (W, 0 = auto / clear-sky)</label><input type="number" step="50" id="pvmax">
      <label>Location lat / lon (clear-sky estimate)</label><div style="display:flex;gap:6px"><input type="number" step="0.001" id="pvlat" placeholder="lat"><input type="number" step="0.001" id="pvlon" placeholder="lon"></div>
      <label>Array kWp / tilt° / azimuth° (180=S)</label><div style="display:flex;gap:6px"><input type="number" step="0.1" id="pvkwp" placeholder="kWp"><input type="number" step="1" id="pvtilt" placeholder="tilt"><input type="number" step="1" id="pvaz" placeholder="az"></div>
      <label>Chart aggregation (per bucket)</label><select id="agg"><option value="avg">avg</option><option value="max">max (catch peaks)</option><option value="min">min</option></select>
      <button class="apply" id="cfgApply">Save</button></div></span>
  <a class="iconbtn" href="/inverter.html" title="Inverter settings (read-only)" style="text-decoration:none">🎛️</a>
  <button class="iconbtn" id="themeBtn" title="Toggle theme">🌙</button>
</header>
<main id="main"></main>

<script>
"use strict";
const VM="/vm/api/v1";
let TARIFF=parseFloat(localStorage.getItem("tariff")||"4.32")||0;  // UA regulated household tariff (₴/kWh, fixed until Oct 2026); no public API — edit in ⚙
let CUR=localStorage.getItem("currency")||"₴";
let PVMAX=parseFloat(localStorage.getItem("pvmax")||"0")||0;
let AGG=localStorage.getItem("agg")||"avg";   // chart bucket aggregation: avg | max | min
const gnum=k=>{const v=parseFloat(localStorage.getItem(k));return isNaN(v)?null:v;};
let PVLAT=gnum("pvlat"),PVLON=gnum("pvlon"),PVKWP=gnum("pvkwp")||0,PVTILT=gnum("pvtilt"),PVAZ=gnum("pvaz");
// clear-sky PV potential (W) now, from sun position + array geometry — the ceiling the panels could reach under a clear sky
function solarElevAz(lat,lon,d){ const r=Math.PI/180,g=180/Math.PI;
  const N=(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())-Date.UTC(d.getUTCFullYear(),0,0))/864e5;
  const dec=23.45*Math.sin(r*360*(284+N)/365), B=r*360*(N-81)/364, EoT=9.87*Math.sin(2*B)-7.53*Math.cos(B)-1.5*Math.sin(B);
  const utcH=d.getUTCHours()+d.getUTCMinutes()/60+d.getUTCSeconds()/3600, st=utcH+lon/15+EoT/60, H=15*(st-12);
  const sinEl=Math.sin(lat*r)*Math.sin(dec*r)+Math.cos(lat*r)*Math.cos(dec*r)*Math.cos(H*r);
  const el=Math.asin(Math.max(-1,Math.min(1,sinEl)))*g;
  const az=(Math.atan2(Math.sin(H*r),Math.cos(H*r)*Math.sin(lat*r)-Math.tan(dec*r)*Math.cos(lat*r))*g+540)%360;
  return {el,az}; }
// PV system derate: base losses (wiring, inverter, soiling, mismatch) × a cell-temperature
// factor (NOCT model). Mirrors pv_derate() in smartess_poller.py — keep the two in sync.
const PV_NOCT=45, PV_TEMP_COEFF=0.004, PV_BASE_DERATE=0.90;
function pvDerate(gti,tAir){ if(tAir==null)return PV_BASE_DERATE;
  const tCell=tAir+(gti/800)*(PV_NOCT-20);
  return Math.max(0.5,Math.min(1.05, PV_BASE_DERATE*(1-PV_TEMP_COEFF*(tCell-25)))); }
function pvPotentialAt(d){ if(PVLAT==null||PVLON==null||!(PVKWP>0))return null;
  const g=gtiAt(d.getTime());
  if(g!=null) return Math.round(PVKWP*g*pvDerate(g,tempAt(d.getTime())));   // tilted irradiance (clouds modelled) × temperature-aware derate
  const {el,az}=solarElevAz(PVLAT,PVLON,d); if(el<=2)return 0;   // fallback (offline): clear-sky geometry × cloud-cover factor
  const r=Math.PI/180, AM=1/Math.sin(el*r), DNI=1000*Math.pow(0.7,Math.pow(AM,0.678));
  const tilt=(PVTILT==null?30:PVTILT), paz=(PVAZ==null?180:PVAZ);
  const cosAOI=Math.sin(el*r)*Math.cos(tilt*r)+Math.cos(el*r)*Math.sin(tilt*r)*Math.cos((az-paz)*r);
  const POA=DNI*Math.max(0,cosAOI)+0.1*DNI*(1+Math.cos(tilt*r))/2;
  return Math.round(PVKWP*POA*1.03*cloudFactor(cloudAt(d.getTime()))); }
function pvPotentialW(){ return pvPotentialAt(new Date()); }

// settings shared across clients via the poller's /settings (localStorage is the local cache)
const SKEYS=["tariff","currency","pvmax","pvlat","pvlon","pvkwp","pvtilt","pvaz","agg"];
function readSettings(){ TARIFF=parseFloat(localStorage.getItem("tariff")||"4.32")||0; CUR=localStorage.getItem("currency")||"₴"; PVMAX=parseFloat(localStorage.getItem("pvmax")||"0")||0; AGG=localStorage.getItem("agg")||"avg"; PVLAT=gnum("pvlat"); PVLON=gnum("pvlon"); PVKWP=gnum("pvkwp")||0; PVTILT=gnum("pvtilt"); PVAZ=gnum("pvaz"); }
function collectSettings(){ const o={}; SKEYS.forEach(k=>{ const v=localStorage.getItem(k); o[k]=(v==null?"":v); }); return o; }
function applyServer(o){ SKEYS.forEach(k=>{ if(!(k in o))return; const v=o[k]; if(v===""||v==null)localStorage.removeItem(k); else localStorage.setItem(k,v); }); readSettings(); }
async function loadServerSettings(){ try{ const o=await (await fetch("/settings")).json(); if(o&&typeof o==="object"&&Object.keys(o).length) applyServer(o); }catch(e){} }
async function saveServerSettings(){ try{ await fetch("/settings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(collectSettings())}); }catch(e){} }

const M={
  soc:"inverter_battery_capacity", loadpct:"inverter_output_load_percent",
  batV:"inverter_battery_voltage", load:"inverter_ac_output_active_power", apparent:"inverter_ac_output_apparent_power",
  pvpow:"inverter_pv_input_voltage * inverter_pv_input_current", pvV:"inverter_pv_input_voltage", pvA:"inverter_pv_input_current",
  gridV:"inverter_grid_voltage", outV:"inverter_ac_output_voltage", busV:"inverter_bus_voltage",
  gridHz:"inverter_grid_frequency", outHz:"inverter_ac_output_frequency", temp:"inverter_heatsink_temperature",
  chg:"inverter_battery_charge_current", dis:"inverter_battery_discharge_current",
  netbat:"inverter_battery_voltage * (inverter_battery_charge_current - inverter_battery_discharge_current)",
  battdis:"inverter_battery_voltage * inverter_battery_discharge_current",
  grid:"clamp_min(inverter_ac_output_active_power + (inverter_battery_voltage*inverter_battery_charge_current) - (inverter_pv_input_voltage*inverter_pv_input_current) - (inverter_battery_voltage*inverter_battery_discharge_current),0)",
  selfnow:"clamp_max(100*(inverter_pv_input_voltage*inverter_pv_input_current)/inverter_ac_output_active_power,100)",
  pf:"inverter_ac_output_active_power / inverter_ac_output_apparent_power", mode:"mode_value", fault:"fault_value", pvtot:"energy_value",
  avg1h:"avg_over_time(inverter_ac_output_active_power[1h])", avg24h:"avg_over_time(inverter_ac_output_active_power[24h])",
};
// energy over a window: lifetime-counter delta (live) OR integral of power (historical backfill, where the counters don't exist). kWh either way.
const eFromP=(c,p,w)=>`(max_over_time(${c}[${w}s]) - min_over_time(${c}[${w}s])) or (avg_over_time((${p})[${w}s]) * ${w}/3600000)`;
const dv={
  cons:w=>eFromP("energymeter_consumed_total","inverter_ac_output_active_power",w),
  pv:w=>eFromP("energymeter_pv_total","inverter_pv_input_voltage*inverter_pv_input_current",w),
  bat:w=>eFromP("energymeter_battery_out_total","inverter_battery_voltage*inverter_battery_discharge_current",w),
  grid:w=>eFromP("energymeter_grid_total",M.grid,w),
  self:w=>`clamp_max(100*(${eFromP("energymeter_pv_total","inverter_pv_input_voltage*inverter_pv_input_current",w)})/(${eFromP("energymeter_consumed_total","inverter_ac_output_active_power",w)}),100)`,
  peakLoad:w=>`max_over_time(inverter_ac_output_active_power[${w}s])`,
  pvPeak:w=>`max_over_time((inverter_pv_input_voltage*inverter_pv_input_current)[${w}s:2m])`,
  minSoc:w=>`min_over_time(inverter_battery_capacity[${w}s])`,
  uptime:w=>`avg_over_time((inverter_grid_voltage > bool 50)[${w}s:1m])*100`,
};
dv.gridCost=w=>`(${dv.grid(w)})*${TARIFF}`;
dv.savings=w=>`clamp_min((${dv.cons(w)})-(${dv.grid(w)}),0)*${TARIFF}`;
dv.total=w=>`(${dv.cons(w)})*${TARIFF}`;
// "today" = delta of the monotonic lifetime counters since local midnight (robust to poller restarts;
// matches the Energy tiles when the Today preset is selected). Ignores the passed window.
const todaySec=()=>Math.max(60,Math.round((Date.now()-new Date().setHours(0,0,0,0))/1000));
const etDelta=m=>`max_over_time(${m}[${todaySec()}s]) - min_over_time(${m}[${todaySec()}s])`;
const dtoday={ cons:()=>etDelta("energymeter_consumed_total"), pv:()=>etDelta("energymeter_pv_total"),
  grid:()=>etDelta("energymeter_grid_total"), bat:()=>etDelta("energymeter_battery_out_total") };
const MODE_MAP={0:["PowerOn","var(--accent)"],1:["Standby","var(--warn)"],2:["Line","var(--good)"],3:["Battery","var(--accent)"],4:["Fault","var(--bad)"],5:["PowerSaving","var(--warn)"],6:["Shutdown","var(--muted)"],7:["Bypass","var(--warn)"]};
const FAULT_MAP={0:["OK","var(--good)"],1:["FAULT","var(--bad)"]};
const CHG_SRC={0:["Idle","var(--muted)"],1:["☀ Solar","var(--good)"],2:["⚡ Grid","var(--accent)"],3:["Solar + Grid","var(--good)"]};
const C={pv:"#22c55e",bat:"#f59e0b",grid:"#3b82f6",load:"var(--text)",cons:"#a855f7"};  // source identity: PV=green, battery=amber, grid=blue

const SECTIONS=[
 {name:"⚡ Now", panels:[
   {t:"gauge",title:"Load",expr:M.loadpct,live:1,unit:"%",min:0,max:100,span:3,th:[[0,"var(--good)"],[70,"var(--warn)"],[90,"var(--bad)"]],sub:{expr:M.load,live:1,unit:"W"}},
   {t:"gauge",title:"PV power",expr:M.pvpow,live:1,unit:"W",min:0,max:1000,maxExpr:"energymeter_pv_peak_power",maxSetting:"pvmax",span:3,th:[[0,C.pv]],sub:{expr:"energymeter_pv_peak_power",live:1,unit:"W",pre:"peak "}},
   {t:"gauge2",title:"Battery SoC",span:3,gauges:[
     {label:"Inverter",expr:M.soc,unit:"%",min:0,max:100,th:[[0,"var(--bad)"],[30,"var(--warn)"],[60,"var(--good)"]],sub:{expr:M.batV,unit:"V",dec:2}},
     {label:"BMS",expr:"bms_soc and (time()-timestamp(bms_soc) < 90)",unit:"%",min:0,max:100,th:[[0,"var(--bad)"],[30,"var(--warn)"],[60,"var(--good)"]],sub:{expr:"bms_pack_voltage",unit:"V",dec:2}}]},
   {t:"multi",title:"Status",span:3,items:[
     {label:"Mode",expr:M.mode,live:1,map:MODE_MAP},
     {label:"Health",expr:M.fault,live:1,map:FAULT_MAP},
     {label:"Heatsink",expr:M.temp,live:1,unit:"°C",th:[[0,"var(--good)"],[55,"var(--warn)"],[70,"var(--bad)"]]}]},
   {t:"table",title:"Sources",span:6,now:1,note:"Values are live; the energy column is today's total. Grid current is inferred (W ÷ V).",cols:["","V","A","W","today"],rows:[
     {label:"PV",color:C.pv,cells:[{expr:M.pvV,unit:"V",dec:1},{expr:M.pvA,unit:"A",dec:1},{expr:M.pvpow,unit:"W"},{dyn:dtoday.pv,unit:"eauto"}]},
     {label:"Battery",color:C.bat,cells:[{expr:M.batV,unit:"V",dec:2},{expr:"inverter_battery_charge_current - inverter_battery_discharge_current",unit:"A",dec:1},{expr:M.netbat,unit:"W"},{dyn:dtoday.bat,unit:"eauto"}]},
     {label:"Grid",color:C.grid,cells:[{expr:M.gridV,unit:"V",dec:1},{expr:`(${M.grid})/inverter_grid_voltage`,unit:"A",dec:1},{expr:M.grid,unit:"W"},{dyn:dtoday.grid,unit:"eauto"}]},
     {label:"Output",color:"var(--text)",cells:[{expr:M.outV,unit:"V",dec:1},{expr:"inverter_ac_output_active_power/inverter_ac_output_voltage",unit:"A",dec:1},{expr:M.load,unit:"W"},{dyn:dtoday.cons,unit:"eauto"}]}]},
   {t:"multi",title:"Cost today",span:3,now:1,items:[

const cssVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const resolveColor=c=>(c&&c.startsWith("var("))?cssVar(c.slice(4,-1)):c;
function fmtDur(ms){ const s=(ms||0)/1000; if(s<90)return Math.round(s)+" s"; if(s<5400)return Math.round(s/60)+" min"; if(s<86400)return (s/3600).toFixed((s/3600)%1?1:0)+" h"; if(s<604800)return Math.round(s/86400)+" d"; if(s<2592000)return Math.round(s/604800)+" wk"; return Math.round(s/2592000)+" mo"; }
function fmtRange(a,b){ const da=new Date(a),db=new Date(b),t=d=>d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}),d=x=>x.toLocaleDateString();
  return (da.toDateString()===db.toDateString())?d(da)+" "+t(da)+"–"+t(db):d(da)+" "+t(da)+" – "+d(db)+" "+t(db); }
function fmt(v,unit,dec){
  if(v==null||!isFinite(v))return "—"; const u=unit||"";
  if(u==="money")return v.toFixed(dec??2)+" "+CUR;
  if(u==="W"&&Math.abs(v)>=1000)return (v/1000).toFixed(dec??2)+" kW";
  if(u==="W")return Math.round(v)+" W";
  if(u==="kWh")return v.toFixed(dec??2)+" kWh";
  if(u==="eauto")return Math.abs(v)<1?(v*1000).toFixed(0)+" Wh":v.toFixed(2)+" kWh";
  if(u==="%")return v.toFixed(dec??0)+" %"; if(u==="°C")return v.toFixed(dec??0)+" °C";
  if(u==="V")return v.toFixed(dec??1)+" V"; if(u==="A")return v.toFixed(dec??1)+" A"; if(u==="Hz")return v.toFixed(dec??2)+" Hz";
  if(u==="Ah")return v.toFixed(dec??1)+" Ah"; if(u==="mV")return Math.round(v)+" mV";
  return dec!=null?v.toFixed(dec):(""+Math.round(v*100)/100);
}
function thColor(v,th){ if(th==null||v==null)return null; let c=null; for(const [t,col] of th){ if(v>=t)c=col; } return c; }
function hexA(c,a){ if(c&&c[0]==="#"){ const n=c.length===4?c.replace(/#(.)(.)(.)/,"#$1$1$2$2$3$3"):c;
  return `rgba(${parseInt(n.slice(1,3),16)},${parseInt(n.slice(3,5),16)},${parseInt(n.slice(5,7),16)},${a})`; } return c; }
let CONN=true;

async function qInstant(expr,atMs){ try{ const r=await fetch(`${VM}/query?query=${encodeURIComponent(expr)}&time=${Math.round(atMs/1000)}`);
  const j=await r.json(); conn(true); const res=j.data&&j.data.result; if(!res||!res.length)return null; const v=parseFloat(res[0].value[1]); return isFinite(v)?v:null; }catch(e){ conn(false); return undefined; } }
async function qRange(expr,from,to,st){ try{ const r=await fetch(`${VM}/query_range?query=${encodeURIComponent(expr)}&start=${Math.round(from/1000)}&end=${Math.round(to/1000)}&step=${st}`);
  const j=await r.json(); conn(true); const res=j.data&&j.data.result; if(!res||!res.length)return []; let best=res[0]; for(const s of res)if(s.values.length>best.values.length)best=s;
  return best.values.map(p=>[p[0]*1000,parseFloat(p[1])]).filter(p=>isFinite(p[1])); }catch(e){ conn(false); return []; } }

const state={ kind:"preset", dur:21600*1000, abs:null, autoMs:30000, timer:null };

  if(state.kind==="today"){ const d=new Date(); d.setHours(0,0,0,0); return {from:d.getTime(),to:Date.now()}; }
  return state.abs; }
function stepSec(){ const {from,to}=range(); return Math.max(10, Math.round((to-from)/1000/400)); }
function windowSec(){ const {from,to}=range(); const evalT=Math.min(to,Date.now()); return {evalT, win:Math.max(60,Math.round((evalT-from)/1000))}; }
const BUCKETS=[60,300,900,1800,3600,10800,21600,43200,86400,604800,2592000]; // 1m … 1 month
function chooseBucket(spanSec){ const target=spanSec/60; for(const b of BUCKETS){ if(b>=target) return b; } return BUCKETS[BUCKETS.length-1]; }

function gaugeSVG(el,v,min,max,unit,dec,th,sub,track,mid,midCol,sub2,tip){ const cx=80,cy=76,r=60,a0=140,a1=400;
  const frac=(v==null)?0:Math.max(0,Math.min(1,(v-min)/(max-min))); const col=resolveColor(thColor(v,th)||"var(--accent)"); const mf=(mid==null)?null:Math.max(0,Math.min(1,(mid-min)/(max-min)));
  let val=v,u=unit||'',dc=dec; if(unit==='W'&&v!=null&&Math.abs(v)>=1000){ val=v/1000; u='kW'; dc=(dec==null?1:dec); }
  const valStr=(v==null)?'—':(dc!=null?val.toFixed(dc):(''+Math.round(val))); const fs=valStr.length>=6?22:valStr.length>=5?26:valStr.length>=4?30:36;
  const pt=a=>{const x=a*Math.PI/180;return [cx+r*Math.cos(x),cy+r*Math.sin(x)];};
  const arc=(f,t)=>{const [x0,y0]=pt(f),[x1,y1]=pt(t);return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 ${(t-f)>180?1:0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;};
  el.innerHTML=`<svg viewBox="0 0 160 122"><path d="${arc(a0,a1)}" fill="none" stroke="${track||cssVar('--grid')}" stroke-width="12" stroke-linecap="round"/>
    ${mf!=null?`<path d="${arc(a0,a0+(a1-a0)*mf)}" fill="none" stroke="${midCol||'#3b82f6'}" stroke-width="12" stroke-linecap="round"/>`:''}
    <path d="${arc(a0,a0+(a1-a0)*frac)}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round"/>
    <text x="80" y="72" text-anchor="middle" font-size="${fs}" font-weight="800" fill="${v==null?cssVar('--muted'):col}">${valStr}<tspan font-size="${Math.round(fs*0.45)}" dx="1" fill="${cssVar('--muted')}">${u}</tspan></text>
    ${sub?`<text x="80" y="${sub2?92:97}" text-anchor="middle" font-size="14" font-weight="600" fill="${cssVar('--muted')}" style="cursor:${tip?'help':'default'}">${tip?`<title>${tip}</title>`:''}${sub}</text>`:''}
    ${sub2?`<text x="80" y="108" text-anchor="middle" font-size="12" font-weight="600" fill="${cssVar('--muted')}">${sub2}</text>`:''}</svg>`; }

function segs(pts,gap){ const out=[]; let cur=[]; for(let i=0;i<pts.length;i++){ if(i&&pts[i][0]-pts[i-1][0]>gap){ if(cur.length)out.push(cur); cur=[]; } cur.push(pts[i]); } if(cur.length)out.push(cur); return out; }
// like segs, but points older than `cutoff` (historical ~5-min cloud data) may connect up to `histGap`; recent live (10s) data uses the normal `baseGap`
function segsAge(pts,baseGap,histGap,cutoff){ const out=[]; let cur=[]; for(let i=0;i<pts.length;i++){ if(i){ const th=pts[i-1][0]<cutoff?Math.max(baseGap,histGap):baseGap; if(pts[i][0]-pts[i-1][0]>th){ if(cur.length)out.push(cur); cur=[]; } } cur.push(pts[i]); } if(cur.length)out.push(cur); return out; }
function niceTicks(mn,mx,n){ if(mn===mx)return [mn]; const raw=(mx-mn)/n,mag=Math.pow(10,Math.floor(Math.log10(raw))),nm=raw/mag; const s=(nm>=5?5:nm>=2?2:1)*mag,out=[]; for(let v=Math.ceil(mn/s)*s;v<=mx+1e-9;v+=s)out.push(v); return out.length?out:[mn,mx]; }
function fmtAxis(v){ const a=Math.abs(v); if(a>=1000)return (v/1000).toFixed(a>=10000?0:1)+"k"; if(a>0&&a<1)return v.toFixed(2); return (Math.round(v*100)/100).toString(); }
function timeTicks(from,to){ const span=to-from,out=[]; const steps=[60e3,300e3,900e3,3600e3,3*3600e3,6*3600e3,12*3600e3,864e5,7*864e5]; let s=steps[steps.length-1]; for(const st of steps){ if(span/st<=7){s=st;break;} }
  const off=new Date().getTimezoneOffset()*60000; for(let v=Math.ceil((from-off)/s)*s+off; v<=to; v+=s) out.push({t:v,l:fmtTick(v,span)}); return out; }
function fmtTick(t,span){ const d=new Date(t),p=n=>String(n).padStart(2,"0"); return span<=2*864e5 ? p(d.getHours())+":"+p(d.getMinutes()) : p(d.getDate())+"."+p(d.getMonth()+1); }

// weather (cloud cover) from Open-Meteo — free, no key, CORS-enabled; optional
let WEATHER=null;
async function fetchWeather(){ if(PVLAT==null||PVLON==null){ WEATHER=null; return; }
  const tilt=Math.round(PVTILT==null?30:PVTILT), omaz=Math.round((PVAZ==null?180:PVAZ)-180);  // Open-Meteo azimuth: 0=S,+W
  try{ const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${PVLAT}&longitude=${PVLON}&current=cloud_cover,temperature_2m&hourly=global_tilted_irradiance,cloud_cover,temperature_2m&tilt=${tilt}&azimuth=${omaz}&past_days=2&forecast_days=1&timezone=GMT`);
    const j=await r.json(); const w=j.current?{cloud:j.current.cloud_cover,temp:j.current.temperature_2m}:{};
    if(j.hourly&&j.hourly.time){ w.gti=j.hourly.time.map((t,i)=>[Date.parse(t+"Z"),j.hourly.global_tilted_irradiance[i]]).filter(p=>p[1]!=null);
      w.cloudH=j.hourly.time.map((t,i)=>[Date.parse(t+"Z"),j.hourly.cloud_cover[i]]);
      w.tempH=j.hourly.time.map((t,i)=>[Date.parse(t+"Z"),j.hourly.temperature_2m[i]]); }
    WEATHER=w; }catch(e){} }
function gtiAt(ms){ if(!WEATHER||!WEATHER.gti||!WEATHER.gti.length)return null; const h=WEATHER.gti;
  if(ms<h[0][0]||ms>h[h.length-1][0]){ let b=null,bd=1e15; for(const[t,v]of h){const d=Math.abs(t-ms);if(d<bd){bd=d;b=v;}} return bd<5400000?b:null; }
  for(let i=1;i<h.length;i++){ if(h[i][0]>=ms){ const[t0,v0]=h[i-1],[t1,v1]=h[i],f=(ms-t0)/(t1-t0||1); return v0+(v1-v0)*f; } } return null; }
function cloudFactor(c){ if(c==null)return 1; const N=Math.max(0,Math.min(1,c/100)); return 1-0.75*Math.pow(N,3.4); }
function cloudAt(ms){ if(!WEATHER)return null; const h=WEATHER.cloudH; if(!h||!h.length)return WEATHER.cloud;
  let b=null,bd=1e15; for(const[t,c]of h){const d=Math.abs(t-ms);if(d<bd){bd=d;b=c;}} return bd<5400000?b:WEATHER.cloud; }
function tempAt(ms){ if(!WEATHER)return null; const h=WEATHER.tempH; const cur=WEATHER.temp==null?null:WEATHER.temp; if(!h||!h.length)return cur;
  if(ms<h[0][0]||ms>h[h.length-1][0]){ let b=null,bd=1e15; for(const[t,v]of h){const d=Math.abs(t-ms);if(v!=null&&d<bd){bd=d;b=v;}} return bd<5400000?b:cur; }
  for(let i=1;i<h.length;i++){ if(h[i][0]>=ms){ const[t0,v0]=h[i-1],[t1,v1]=h[i]; if(v0==null||v1==null)return v0==null?v1:v0; return v0+(v1-v0)*(ms-t0)/(t1-t0||1); } } return cur; }

// client-computed values (not from VM): PV headroom vs clear-sky potential
const CLIENT={
  availNow: async()=> pvPotentialW(),
  spareNow: async()=>{ const a=pvPotentialW(); if(a==null)return null; const pv=await qInstant(M.pvpow,Date.now()); return (pv==null)?null:Math.max(0,a-pv); },
  cloud: async()=> WEATHER?WEATHER.cloud:null,
  unusedKwh: async()=>{ if(pvPotentialW()==null)return null; const to=Date.now(),from=new Date().setHours(0,0,0,0),step=300;
    const pv=await qRange(`avg_over_time((${M.pvpow})[${step}s])`,from,to,step); let wh=0;
    for(const [t,v] of pv){ const a=pvPotentialAt(new Date(t)); if(a!=null) wh+=Math.max(0,a-v)*step/3600; } return wh/1000; },
  solarToday: async()=>{ if(pvPotentialW()==null)return null; const from=new Date().setHours(0,0,0,0),to=from+864e5,step=300000; let wh=0;   // modelled available solar for the WHOLE day (forecast for the hours not yet passed)
    for(let t=from;t<to;t+=step){ const a=pvPotentialAt(new Date(t)); if(a!=null) wh+=a*step/3600000; } return wh/1000; },

async function refresh(){ const now=Date.now(),{from,to}=range(),st=stepSec(),{evalT,win}=windowSec();

        const conf=pvPotentialW()!=null,pts=[]; if(conf)for(let t=from;t<=to;t+=st*1000){ const a=pvPotentialAt(new Date(t)); if(a!=null)pts.push([t,a]); } return {...s,pts}; }   // recent: client weather-model available solar
        const ag=s.agg||p.agg||AGG; return {...s,pts:await qRange(`${ag}_over_time((${s.expr})[${aw}s])`,from,to,st)}; })); c.chart.setData(series); }

function recordHist(){ const s=snapState(); if(rangeIdx>=0 && JSON.stringify(rangeHist[rangeIdx])===JSON.stringify(s))return; rangeHist=rangeHist.slice(0,rangeIdx+1); rangeHist.push(s); if(rangeHist.length>100)rangeHist.shift(); rangeIdx=rangeHist.length-1; }

  PVLAT=setNum("pvlat","pvlat"); PVLON=setNum("pvlon","pvlon"); PVKWP=setNum("pvkwp","pvkwp")||0; PVTILT=setNum("pvtilt","pvtilt"); PVAZ=setNum("pvaz","pvaz");
  AGG=V("agg")||"avg"; localStorage.setItem("agg",AGG);
  cfgPop.classList.remove("open"); cfgBtn.classList.remove("on"); saveServerSettings(); fetchWeather(); refresh(); });
document.addEventListener("click",e=>{ if(!e.target.closest(".rel")){ pop.classList.remove("open");cbtn.classList.remove("on"); cfgPop.classList.remove("open");cfgBtn.classList.remove("on"); } });

function curTheme(){ const a=document.documentElement.getAttribute("data-theme"); return a||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"); }
function applyTheme(t){ if(t)document.documentElement.setAttribute("data-theme",t); else document.documentElement.removeAttribute("data-theme"); document.getElementById("themeBtn").textContent=curTheme()==="dark"?"☀️":"🌙";
  cards.forEach(c=>{ if(c.chart){ c.chart.draw(); c.legItems.forEach(l=>l.ic.style.background=resolveColor(l.color)); } else if(c.p.t==="gauge") renderGauge(c); else if(c.p.t==="gauge2") renderGauge2(c); else if(c.p.t==="info") renderInfo(c); else if(c.p.t==="multi") renderMulti(c); else if(c.p.t==="table") renderTable(c); else if(c.p.t==="cells") renderCells(c); else if(c.p.t==="sky") renderSky(c); else renderStat(c); }); }
document.getElementById("themeBtn").addEventListener("click",()=>{ const t=curTheme()==="dark"?"light":"dark"; localStorage.setItem("theme",t); applyTheme(t); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{ if(!localStorage.getItem("theme"))applyTheme(null); });
applyTheme(localStorage.getItem("theme")||null);
if(new URLSearchParams(location.search).has("kiosk")) document.body.classList.add("kiosk");

// custom tooltips on card titles — hover on desktop, tap on touch (native title has neither styling nor touch)
const tip=document.createElement("div"); tip.id="tip"; document.body.appendChild(tip);
function showTip(el){ const t=el.dataset.tip; if(!t)return; tip.textContent=t; tip.style.display="block"; tip.dataset.for=t;
  const r=el.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;
  let x=Math.max(8,Math.min(r.left,innerWidth-tw-8)),y=r.bottom+6; if(y+th>innerHeight-8)y=Math.max(8,r.top-th-6);
  tip.style.left=x+"px"; tip.style.top=y+"px"; }
function hideTip(){ tip.style.display="none"; tip.dataset.for=""; }
document.addEventListener("mouseover",e=>{ const h=e.target.closest&&e.target.closest("h3[data-tip]"); if(h)showTip(h); });
document.addEventListener("mouseout",e=>{ const h=e.target.closest&&e.target.closest("h3[data-tip]"); if(h)hideTip(); });
document.addEventListener("click",e=>{ const h=e.target.closest&&e.target.closest("h3[data-tip]"); if(h){ (tip.style.display==="block"&&tip.dataset.for===h.dataset.tip)?hideTip():showTip(h); } else hideTip(); });
addEventListener("scroll",hideTip,true);

let rz; new ResizeObserver(()=>{clearTimeout(rz);rz=setTimeout(()=>cards.forEach(c=>c.chart&&c.chart.draw()),120);}).observe(main);
setInterval(fetchWeather, 900000);
state.timer=setInterval(tick,state.autoMs);
recordHist();   // seed undo history with the initial (6h live) view
loadServerSettings().then(()=>{ fetchWeather(); refresh(); });
</script>
