# Telegraf: read smartess/* from Mosquitto and write to VictoriaMetrics.
# Runs with network_mode: host, so 127.0.0.1 is the Pi itself.

[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true
  quiet = true

# VictoriaMetrics accepts the InfluxDB line protocol on /write.
[[outputs.influxdb]]
  urls = ["http://127.0.0.1:8428"]
  database = "smartess"
  skip_database_creation = true

# Main telemetry: the poller publishes all QPIGS fields as one JSON object.
# Numeric fields become metrics named inverter_<field> (e.g. inverter_battery_voltage).
[[inputs.mqtt_consumer]]
  servers = ["tcp://127.0.0.1:1883"]
  topics = ["smartess/qpigs_json"]
  data_format = "json"
  name_override = "inverter"
  client_id = "telegraf-smartess-json"
  # username = ""
  # password = ""

# Total generated energy (kWh) -> metric energy_value
[[inputs.mqtt_consumer]]
  servers = ["tcp://127.0.0.1:1883"]
  topics = ["smartess/energy_total_kwh"]
  data_format = "value"
  data_type = "float"
  name_override = "energy"
  client_id = "telegraf-smartess-energy"

# Working mode as a number (0=PowerOn 1=Standby 2=Line 3=Battery 4=Fault ...) -> mode_value
[[inputs.mqtt_consumer]]
  servers = ["tcp://127.0.0.1:1883"]
  topics = ["smartess/mode_code"]
  data_format = "value"
  data_type = "integer"
  name_override = "mode"
  client_id = "telegraf-smartess-mode"

# Fault flag (0 = ok, 1 = warning/fault active) -> fault_value
[[inputs.mqtt_consumer]]
  servers = ["tcp://127.0.0.1:1883"]
  topics = ["smartess/fault"]
  data_format = "value"
  data_type = "integer"
  name_override = "fault"
  client_id = "telegraf-smartess-fault"

# Energy counters (kWh, per source, today + lifetime) as JSON ->
# metrics energymeter_consumed_today, energymeter_pv_today, energymeter_grid_total, ...
[[inputs.mqtt_consumer]]
  servers = ["tcp://127.0.0.1:1883"]
  topics = ["smartess/energy_stats"]
  data_format = "json"
  name_override = "energymeter"
  client_id = "telegraf-smartess-energymeter"

# Battery BMS (JK BMS over BLE, published by bms/jk_bms.py) as JSON ->
# metrics bms_soc, bms_soh, bms_pack_voltage, bms_current, bms_cell_1..16,
# bms_temp_1/2/mos, bms_cycles, bms_remaining_ah, ...
[[inputs.mqtt_consumer]]
  servers = ["tcp://127.0.0.1:1883"]
  topics = ["smartess/bms_json"]
  data_format = "json"
  name_override = "bms"
  client_id = "telegraf-smartess-bms"

# Weather for the solar array (Open-Meteo tilted irradiance + cloud + temperature),
# published by the poller every ~10 min -> metrics weather_gti, weather_cloud,
# weather_temp, weather_pv_potential_w. Storing the modelled irradiance next to the
# actual PV power is what lets us build real history and calibrate the forecast.
[[inputs.mqtt_consumer]]
  servers = ["tcp://127.0.0.1:1883"]
  topics = ["smartess/weather_json"]
  data_format = "json"
  name_override = "weather"
  client_id = "telegraf-smartess-weather"

# Inverter settings snapshot (QPIRI + QFLAG), published by the poller ONLY when a
# value changes -> metrics rated_battery_float_voltage, rated_max_charging_current,
# rated_flag_backlight, ... Sparse change-points = a queryable settings timeline.
[[inputs.mqtt_consumer]]
  servers = ["tcp://127.0.0.1:1883"]
  topics = ["smartess/rated_json"]
  data_format = "json"
  name_override = "rated"
  client_id = "telegraf-smartess-rated"
