# Visualization stack for smartess-poller: MQTT -> Telegraf -> VictoriaMetrics -> Grafana.
# Designed to sit alongside Pi-hole / Vaultwarden / Caddy on a Raspberry Pi 3B+ (1 GB RAM,
# armv7): memory-limited, isolated network, Grafana fronted by your existing Caddy.
#
#   cp .env.example .env   # set the Grafana admin password
#   docker compose up -d
#
# Images are multi-arch and include linux/arm/v7.

services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: smartess-vm
    restart: unless-stopped
    command:
      - "-storageDataPath=/vmdata"
      - "-retentionPeriod=24"          # keep 24 months of history
      - "-memory.allowedPercent=60"
    ports:
      - "127.0.0.1:8428:8428"          # exposed to host only, so host-networked Telegraf can write
    volumes:
      - vmdata:/vmdata
    mem_limit: 128m
    networks: [smartess]

  telegraf:
    image: telegraf:1.30
    container_name: smartess-telegraf
    restart: unless-stopped
    network_mode: host                 # so it can reach Mosquitto (127.0.0.1:1883) and VM (127.0.0.1:8428)
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
    mem_limit: 96m
    depends_on: [victoriametrics]

  # Grafana was removed — the poller now serves a lightweight built-in dashboard
  # (web/index.html) that is far lighter on a Pi 3B+. The Grafana provisioning
  # files remain under ./grafana/ if you ever want to re-add the service.

volumes:
  vmdata:

networks:
  smartess:
